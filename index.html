<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunter</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #07111f, #101b2d);
  color: white;
  min-height: 100vh;
}

button {
  font-family: inherit;
}

.screen {
  min-height: 100vh;
  padding: 16px;
  text-align: center;
}

.hidden {
  display: none !important;
}

/* =========================
   ВЕРХ
========================= */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.balance,
.level-box {
  background: #182840;
  border: 1px solid #294568;
  border-radius: 14px;
  padding: 10px 13px;
  font-weight: bold;
}

.balance {
  font-size: 16px;
}

.level-box {
  font-size: 15px;
}

h1 {
  margin: 17px 0 3px;
  font-size: 31px;
}

.subtitle {
  color: #8fa8c4;
  margin-bottom: 12px;
}

/* =========================
   XP
========================= */

.xp-box {
  max-width: 430px;
  margin: auto;
}

.xp-text {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #9bb1c9;
  margin-bottom: 6px;
}

.xp-bar {
  height: 10px;
  background: #0b1726;
  border: 1px solid #29415e;
  border-radius: 10px;
  overflow: hidden;
}

.xp-fill {
  height: 100%;
  width: 0%;
  border-radius: 10px;
  background: linear-gradient(90deg, #3c8cff, #71d9ff);
  transition: width .4s ease;
}

/* =========================
   УДАЧА
========================= */

.luck-box {
  max-width: 430px;
  margin: 10px auto 0;
}

.luck-top {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #9bb1c9;
  margin-bottom: 5px;
}

.luck-bar {
  height: 8px;
  background: #0b1726;
  border: 1px solid #29415e;
  border-radius: 10px;
  overflow: hidden;
}

.luck-fill {
  height: 100%;
  width: 0%;
  border-radius: 10px;
  background: linear-gradient(90deg, #ff9f1c, #ffe66d);
  transition: width .35s ease;
}

.luck-active {
  color: #ffd84d;
  font-weight: bold;
}

/* =========================
   ДОРОЖКА УРОВНЕЙ
========================= */

.level-track-wrapper {
  margin: 15px auto 0;
  max-width: 430px;
  overflow-x: auto;
  padding-bottom: 5px;
  scrollbar-width: none;
}

.level-track-wrapper::-webkit-scrollbar {
  display: none;
}

.level-track {
  display: flex;
  gap: 9px;
  width: max-content;
  padding: 2px;
}

.level-node {
  width: 72px;
  min-width: 72px;
  padding: 8px 5px;

  background: #111f33;
  border: 1px solid #29415e;
  border-radius: 13px;
}

.level-node.current {
  border-color: #4b9cff;
  box-shadow: 0 0 12px rgba(75,156,255,.25);
}

.level-node.completed {
  border-color: #4fd47b;
}

.level-number {
  font-size: 12px;
  color: #a7bbd0;
}

.level-reward {
  font-size: 22px;
  margin-top: 3px;
}

.level-reward-text {
  font-size: 10px;
  color: #9bb1c9;
  margin-top: 3px;
  white-space: nowrap;
}

/* =========================
   СУНДУК
========================= */

.chest-area {
  height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chest {
  position: relative;
  width: 200px;
  height: 165px;
  transition: transform .2s;
}

.chest-body,
.chest-lid {
  transition:
    background .3s,
    border-color .3s,
    box-shadow .3s;
}

.chest-body {
  position: absolute;
  left: 0;
  bottom: 0;

  width: 200px;
  height: 115px;

  background: linear-gradient(180deg, #a85d25, #6e3516);
  border: 5px solid #3b1d0b;
  border-radius: 12px;
}

.chest-lid {
  position: absolute;
  left: 0;
  top: 0;

  width: 200px;
  height: 62px;

  background: linear-gradient(180deg, #c97932, #874315);
  border: 5px solid #3b1d0b;
  border-radius: 15px 15px 5px 5px;

  transform-origin: left bottom;
  transition: transform .55s cubic-bezier(.2,.8,.2,1);
  z-index: 2;
}

.lock {
  position: absolute;
  z-index: 5;

  left: 50%;
  top: 55%;

  width: 35px;
  height: 41px;

  transform: translate(-50%, -50%);

  background: #f1bd35;
  border: 4px solid #704707;
  border-radius: 7px;
}

.opened .chest-lid {
  transform: translateY(-53px) rotate(-12deg);
}

.shake {
  animation: shake .35s;
}

@keyframes shake {
  0%,100% {
    transform: translateX(0);
  }

  25% {
    transform: translateX(-8px) rotate(-2deg);
  }

  75% {
    transform: translateX(8px) rotate(2deg);
  }
}

/* =========================
   ВИДЫ КЕЙСОВ
========================= */

/* ОБЫЧНЫЙ */

.chest.normal .chest-body {
  background: linear-gradient(180deg, #a85d25, #6e3516);
  border-color: #3b1d0b;
}

.chest.normal .chest-lid {
  background: linear-gradient(180deg, #c97932, #874315);
  border-color: #3b1d0b;
}

.chest.normal .lock {
  background: #f1bd35;
  border-color: #704707;
}

/* ВОЕННЫЙ */

.chest.military .chest-body {
  background: linear-gradient(180deg, #53685c, #26372e);
  border-color: #151d19;
  box-shadow: 0 0 25px rgba(91,122,99,.2);
}

.chest.military .chest-lid {
  background: linear-gradient(180deg, #718776, #394b40);
  border-color: #151d19;
}

.chest.military .lock {
  background: #4e5d53;
  border-color: #151d19;
}

/* АЛМАЗНЫЙ */

.chest.diamond .chest-body {
  background: linear-gradient(180deg, #39bfe8, #17659a);
  border-color: #073e68;
  box-shadow: 0 0 30px rgba(50,190,255,.35);
}

.chest.diamond .chest-lid {
  background: linear-gradient(180deg, #66e4ff, #197eaf);
  border-color: #073e68;
}

.chest.diamond .lock {
  background: #c8f7ff;
  border-color: #167a9e;
}

/* ЛЕГЕНДАРНЫЙ */

.chest.legendary .chest-body {
  background: linear-gradient(180deg, #dcae32, #8c5810);
  border-color: #5b3505;
  box-shadow: 0 0 35px rgba(255,202,55,.45);
}

.chest.legendary .chest-lid {
  background: linear-gradient(180deg, #ffe36a, #b87815);
  border-color: #5b3505;
}

.chest.legendary .lock {
  background: #fff0a1;
  border-color: #8b5a08;
}

/* =========================
   НАЗВАНИЕ
========================= */

.case-name {
  font-size: 24px;
  font-weight: bold;
  margin-top: -2px;
}

.case-price {
  color: #ffd84d;
  font-size: 18px;
  font-weight: bold;
  margin-top: 7px;
}

/* =========================
   КНОПКА
========================= */

.open-button {
  width: 100%;
  max-width: 290px;

  padding: 16px;
  margin-top: 13px;

  border: 0;
  border-radius: 16px;

  background: linear-gradient(135deg, #ffbd2e, #ff8c00);
  color: #1b1200;

  font-size: 18px;
  font-weight: bold;

  box-shadow: 0 8px 25px rgba(255,157,0,.25);
}

.open-button:active {
  transform: scale(.97);
}

.open-button:disabled {
  opacity: .45;
}

/* =========================
   СТАТИСТИКА
========================= */

.stats {
  margin: 21px auto 0;
  max-width: 430px;

  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.stat {
  background: #111f33;
  border: 1px solid #253d59;
  border-radius: 14px;
  padding: 12px;
}

.stat-title {
  color: #8199b5;
  font-size: 12px;
}

.stat-value {
  font-size: 16px;
  font-weight: bold;
  margin-top: 4px;
}

/* =========================
   МОДАЛКА
========================= */

.modal {
  position: fixed;
  inset: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,.72);
  z-index: 100;

  padding: 20px;
}

.modal-box {
  width: 100%;
  max-width: 390px;

  background: #14253a;
  border: 1px solid #355574;
  border-radius: 24px;

  padding: 22px;
}

.modal-title {
  font-size: 25px;
  font-weight: bold;
}

.reward-money {
  color: #ffd84d;
  font-size: 27px;
  font-weight: bold;
  margin-top: 9px;
}

.reward-xp {
  color: #72c8ff;
  font-size: 18px;
  font-weight: bold;
  margin-top: 7px;
}

.new-level {
  color: #70ff9a;
  font-size: 18px;
  font-weight: bold;
  margin-top: 8px;
}

.items {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-top: 15px;
}

.item {
  background: #0d1b2d;
  border-radius: 14px;
  padding: 12px;
}

.item-image {
  font-size: 36px;
}

.item-name {
  font-size: 13px;
  margin-top: 5px;
}

.item-rarity {
  color: #819bb6;
  font-size: 11px;
  margin-top: 3px;
}

.close-button {
  width: 100%;
  padding: 14px;
  margin-top: 16px;

  border: 0;
  border-radius: 14px;

  background: #2768a8;
  color: white;

  font-size: 16px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="screen">

  <!-- ВЕРХ -->

  <div class="top">

    <div class="balance">
      💰 <span id="balance">10000</span>
    </div>

    <div class="level-box">
      ⭐ Ур. <span id="level">1</span>
    </div>

  </div>


  <h1>Treasure Hunter</h1>

  <div class="subtitle">
    Открывай кейсы и собирай сокровища!
  </div>


  <!-- XP -->

  <div class="xp-box">

    <div class="xp-text">
      <span>⭐ XP</span>

      <span>
        <span id="xp">0</span> /
        <span id="xpNeed">1000</span>
      </span>
    </div>

    <div class="xp-bar">
      <div class="xp-fill" id="xpFill"></div>
    </div>

  </div>


  <!-- УДАЧА -->

  <div class="luck-box">

    <div class="luck-top">

      <span id="luckText">
        🍀 2× удача
      </span>

      <span>
        <span id="luckProgress">0</span>/10
      </span>

    </div>

    <div class="luck-bar">

      <div
        class="luck-fill"
        id="luckFill">
      </div>

    </div>

  </div>


  <!-- ДОРОЖКА УРОВНЕЙ -->

  <div class="level-track-wrapper">

    <div class="level-track" id="levelTrack">
    </div>

  </div>


  <!-- СУНДУК -->

  <div class="chest-area">

    <div
      class="chest normal"
      id="chest">

      <div class="chest-lid"></div>

      <div class="chest-body"></div>

      <div class="lock"></div>

    </div>

  </div>


  <!-- КЕЙС -->

  <div
    class="case-name"
    id="caseName">

    Обычный кейс

  </div>

  <div class="case-price">

    💰 <span id="casePrice">
      2 500
    </span>

  </div>


  <!-- ОТКРЫТЬ -->

  <button
    class="open-button"
    id="openButton"
    onclick="openCase()">

    ОТКРЫТЬ КЕЙС

  </button>


  <!-- СТАТИСТИКА -->

  <div class="stats">

    <div class="stat">

      <div class="stat-title">
        Открыто кейсов
      </div>

      <div
        class="stat-value"
        id="opened">

        0

      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Всего заработано
      </div>

      <div
        class="stat-value">

        💰 <span id="totalEarned">
          0
        </span>

      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Уровень
      </div>

      <div
        class="stat-value">

        ⭐ <span id="levelStat">
          1
        </span>

      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Текущий кейс
      </div>

      <div
        class="stat-value"
        id="caseStat">

        Обычный

      </div>

    </div>

  </div>

</div>


<!-- =========================
     НАГРАДА
========================= -->

<div
  class="modal hidden"
  id="rewardModal">

  <div class="modal-box">

    <div class="modal-title">
      🎉 Кейс открыт!
    </div>

    <div class="reward-money">
      +💰 <span id="rewardMoney">0</span>
    </div>

    <div class="reward-xp">
      ⭐ +100 XP
    </div>

    <div
      class="new-level hidden"
      id="newLevel">

      🎊 Новый уровень!

    </div>

    <div
      class="items"
      id="items">
    </div>

    <button
      class="close-button"
      onclick="closeReward()">

      ЗАБРАТЬ

    </button>

  </div>

</div>


<script>

/* =========================
   КЕЙСЫ
========================= */

const cases = {

  1: {
    name: "Обычный кейс",
    shortName: "Обычный",
    className: "normal",
    price: 2500,
    min: 500,
    max: 10000
  },

  2: {
    name: "Военный кейс",
    shortName: "Военный",
    className: "military",
    price: 10000,
    min: 2000,
    max: 50000
  },

  3: {
    name: "Алмазный кейс",
    shortName: "Алмазный",
    className: "diamond",
    price: 50000,
    min: 15000,
    max: 200000
  },

  4: {
    name: "Легендарный кейс",
    shortName: "Легендарный",
    className: "legendary",
    price: 250000,
    min: 40000,
    max: 1000000
  }

};


/* =========================
   ПРЕДМЕТЫ
========================= */

const itemPool = [

  {
    name: "Монета",
    icon: "🪙",
    rarity: "Обычный"
  },

  {
    name: "Кристалл",
    icon: "💠",
    rarity: "Необычный"
  },

  {
    name: "Золотой слиток",
    icon: "🥇",
    rarity: "Редкий"
  },

  {
    name: "Алмаз",
    icon: "💎",
    rarity: "Эпический"
  },

  {
    name: "Корона",
    icon: "👑",
    rarity: "Легендарный"
  },

  {
    name: "Артефакт",
    icon: "🔮",
    rarity: "Мифический"
  }

];


/* =========================
   НАГРАДЫ ЗА УРОВНИ
========================= */

const levelRewards = {

  2: {
    icon: "💰",
    text: "1 000"
  },

  3: {
    icon: "💰",
    text: "2 000"
  },

  4: {
    icon: "💰",
    text: "3 000"
  },

  5: {
    icon: "🪖",
    text: "Военный"
  },

  6: {
    icon: "💰",
    text: "5 000"
  },

  7: {
    icon: "💰",
    text: "7 500"
  },

  8: {
    icon: "💰",
    text: "10 000"
  },

  9: {
    icon: "💰",
    text: "15 000"
  },

  10: {
    icon: "💎",
    text: "Алмазный"
  },

  11: {
    icon: "💰",
    text: "20 000"
  },

  12: {
    icon: "💰",
    text: "25 000"
  },

  13: {
    icon: "💰",
    text: "30 000"
  },

  14: {
    icon: "💰",
    text: "35 000"
  },

  15: {
    icon: "💰",
    text: "50 000"
  },

  16: {
    icon: "💰",
    text: "60 000"
  },

  17: {
    icon: "💰",
    text: "70 000"
  },

  18: {
    icon: "💰",
    text: "80 000"
  },

  19: {
    icon: "💰",
    text: "100 000"
  },

  20: {
    icon: "👑",
    text: "Легендарный"
  }

};


/* =========================
   СОХРАНЕНИЕ
========================= */

let balance =
  Number(localStorage.getItem("balance")) || 10000;

let opened =
  Number(localStorage.getItem("opened")) || 0;

let totalEarned =
  Number(localStorage.getItem("totalEarned")) || 0;

let xp =
  Number(localStorage.getItem("xp")) || 0;

let luckyActive =
  localStorage.getItem("luckyActive") === "true";

let luckyProgress =
  Number(localStorage.getItem("luckyProgress")) || 0;


/* =========================
   НАСТРОЙКИ
========================= */

const XP_PER_CASE = 100;

const XP_PER_LEVEL = 1000;


/* =========================
   УРОВЕНЬ
========================= */

function getLevel() {

  return Math.floor(
    xp / XP_PER_LEVEL
  ) + 1;

}


/* =========================
   ТЕКУЩИЙ КЕЙС
========================= */

function getCurrentCase() {

  const level = getLevel();

  if (level >= 20) {
    return 4;
  }

  if (level >= 10) {
    return 3;
  }

  if (level >= 5) {
    return 2;
  }

  return 1;

}


/* =========================
   СОХРАНИТЬ
========================= */

function save() {

  localStorage.setItem(
    "balance",
    balance
  );

  localStorage.setItem(
    "opened",
    opened
  );

  localStorage.setItem(
    "totalEarned",
    totalEarned
  );

  localStorage.setItem(
    "xp",
    xp
  );

  localStorage.setItem(
    "luckyActive",
    luckyActive
  );

  localStorage.setItem(
    "luckyProgress",
    luckyProgress
  );

}


/* =========================
   ДОРОЖКА УРОВНЕЙ
========================= */

function renderLevelTrack() {

  const track =
    document.getElementById("levelTrack");

  const level =
    getLevel();

  track.innerHTML = "";


  for (
    let i = 1;
    i <= Math.max(20, level + 3);
    i++
  ) {

    const node =
      document.createElement("div");

    node.className = "level-node";


    if (i === level) {
      node.classList.add("current");
    }

    if (i < level) {
      node.classList.add("completed");
    }


    let reward =
      levelRewards[i];


    if (!reward) {

      reward = {
        icon: "🎁",
        text: "Награда"
      };

    }


    node.innerHTML = `

      <div class="level-number">
        Уровень ${i}
      </div>

      <div class="level-reward">
        ${reward.icon}
      </div>

      <div class="level-reward-text">
        ${reward.text}
      </div>

    `;


    track.appendChild(node);

  }


  /* Прокручиваем к текущему уровню */

  setTimeout(() => {

    const current =
      track.querySelector(".current");

    if (current) {

      current.scrollIntoView({
        behavior: "smooth",
        inline: "center",
        block: "nearest"
      });

    }

  }, 100);

}


/* =========================
   ВЫДАТЬ НАГРАДУ
========================= */

function giveLevelReward(level) {

  const reward =
    levelRewards[level];


  if (!reward) {
    return;
  }


  /* Награды деньгами */

  if (reward.icon === "💰") {

    const amount =
      Number(
        reward.text.replace(/\s/g, "")
      );

    balance += amount;

    totalEarned += amount;

  }

}


/* =========================
   ОБНОВИТЬ
========================= */

function updateUI() {

  const level =
    getLevel();

  const caseId =
    getCurrentCase();

  const currentCase =
    cases[caseId];


  document.getElementById(
    "balance"
  ).textContent =
    balance.toLocaleString("ru-RU");


  document.getElementById(
    "level"
  ).textContent =
    level;


  document.getElementById(
    "levelStat"
  ).textContent =
    level;


  document.getElementById(
    "xp"
  ).textContent =
    xp % XP_PER_LEVEL;


  document.getElementById(
    "xpNeed"
  ).textContent =
    XP_PER_LEVEL;


  const xpPercent =
    ((xp % XP_PER_LEVEL) /
    XP_PER_LEVEL) * 100;


  document.getElementById(
    "xpFill"
  ).style.width =
    xpPercent + "%";


  /* УДАЧА */

  document.getElementById(
    "luckProgress"
  ).textContent =
    luckyProgress;


  document.getElementById(
    "luckFill"
  ).style.width =
    (luckyProgress * 10) + "%";


  document.getElementById(
    "luckText"
  ).textContent =
    luckyActive
      ? "🔥 2× удача активна!"
      : "🍀 2× удача";


  if (luckyActive) {

    document.getElementById(
      "luckText"
    ).classList.add("luck-active");

  } else {

    document.getElementById(
      "luckText"
    ).classList.remove("luck-active");

  }


  /* КЕЙС */

  document.getElementById(
    "caseName"
  ).textContent =
    currentCase.name;


  document.getElementById(
    "casePrice"
  ).textContent =
    currentCase.price.toLocaleString("ru-RU");


  document.getElementById(
    "caseStat"
  ).textContent =
    currentCase.shortName;


  document.getElementById(
    "opened"
  ).textContent =
    opened;


  document.getElementById(
    "totalEarned"
  ).textContent =
    totalEarned.toLocaleString("ru-RU");


  /* СТИЛЬ СУНДУКА */

  const chest =
    document.getElementById("chest");

  chest.className =
    "chest " +
    currentCase.className;


  /* КНОПКА */

  const button =
    document.getElementById(
      "openButton"
    );


  /*
    ВАЖНО:
    проверяем только деньги.
    ЭНЕРГИИ БОЛЬШЕ НЕТ.
  */

  button.disabled =
    balance < currentCase.price;


  renderLevelTrack();

}


/* =========================
   СЛУЧАЙНОЕ ЧИСЛО
========================= */

function randomInt(min, max) {

  return Math.floor(
    Math.random() *
    (max - min + 1)
  ) + min;

}


/* =========================
   ОТКРЫТЬ КЕЙС
========================= */

function openCase() {

  const caseId =
    getCurrentCase();

  const currentCase =
    cases[caseId];


  if (balance < currentCase.price) {

    alert(
      "Недостаточно денег для открытия кейса!"
    );

    return;

  }


  const oldLevel =
    getLevel();


  /* Снимаем цену */

  balance -= currentCase.price;


  /* НАГРАДА */

  let reward;


  if (luckyActive) {

    reward =
      randomInt(
        Math.ceil(
          (currentCase.min +
          currentCase.max) / 2
        ),
        currentCase.max
      );

    luckyActive = false;

  } else {

    reward =
      randomInt(
        currentCase.min,
        currentCase.max
      );

  }


  /* 1% максимальной награды */

  if (Math.random() < 0.01) {

    reward =
      currentCase.max;

  }


  balance += reward;

  totalEarned += reward;


  /* Кейс открыт */

  opened++;


  /* XP */

  xp += XP_PER_CASE;


  /* УДАЧА */

  if (!luckyActive) {

    luckyProgress++;

  }


  if (luckyProgress >= 10) {

    luckyActive = true;

    luckyProgress = 0;

  }


  const newLevel =
    getLevel();


  /* Выдаём награды за все новые уровни */

  if (newLevel > oldLevel) {

    for (
      let lvl = oldLevel + 1;
      lvl <= newLevel;
      lvl++
    ) {

      giveLevelReward(lvl);

    }

  }


  save();

  updateUI();


  /* СУНДУК */

  const chest =
    document.getElementById("chest");


  chest.classList.remove("shake");
  chest.classList.remove("opened");


  void chest.offsetWidth;


  chest.classList.add("shake");


  setTimeout(() => {

    chest.classList.add("opened");

  }, 350);


  /* ПОКАЗАТЬ НАГРАДУ */

  showReward(
    reward,
    newLevel > oldLevel
  );

}


/* =========================
   НАГРАДА
========================= */

function showReward(
  reward,
  leveledUp
) {

  document.getElementById(
    "rewardMoney"
  ).textContent =
    reward.toLocaleString("ru-RU");


  const levelMessage =
    document.getElementById(
      "newLevel"
    );


  if (leveledUp) {

    levelMessage.textContent =
      "🎊 Новый уровень! Ур. " +
      getLevel();

    levelMessage.classList.remove(
      "hidden"
    );

  } else {

    levelMessage.classList.add(
      "hidden"
    );

  }


  const items =
    document.getElementById(
      "items"
    );

  items.innerHTML = "";


  const count =
    randomInt(2, 5);


  const used = [];


  while (used.length < count) {

    const item =
      itemPool[
        randomInt(
          0,
          itemPool.length - 1
        )
      ];


    if (!used.includes(item)) {

      used.push(item);

    }

  }


  used.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "item";


    div.innerHTML = `

      <div class="item-image">
        ${item.icon}
      </div>

      <div class="item-name">
        ${item.name}
      </div>

      <div class="item-rarity">
        ${item.rarity}
      </div>

    `;


    items.appendChild(div);

  });


  document.getElementById(
    "rewardModal"
  ).classList.remove(
    "hidden"
  );

}


/* =========================
   ЗАКРЫТЬ
========================= */

function closeReward() {

  document.getElementById(
    "rewardModal"
  ).classList.add(
    "hidden"
  );


  const chest =
    document.getElementById(
      "chest"
    );


  chest.classList.remove(
    "opened"
  );

  chest.classList.remove(
    "shake"
  );

}


/* =========================
   ЗАПУСК
========================= */

updateUI();

</script>
