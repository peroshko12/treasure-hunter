<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunter</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #07152e, #0d2345);
  color: white;
  min-height: 100vh;
}

.container {
  max-width: 430px;
  margin: auto;
  padding: 18px 15px 40px;
}

h1 {
  text-align: center;
  margin: 5px 0;
  font-size: 30px;
}

.subtitle {
  text-align: center;
  color: #9eb6d8;
  margin-bottom: 18px;
}

.balance {
  background: #102b50;
  border: 1px solid #244a78;
  border-radius: 16px;
  padding: 14px;
  text-align: center;
  font-size: 23px;
  font-weight: bold;
}

.luck {
  text-align: center;
  background: #173963;
  border-radius: 12px;
  padding: 10px;
  margin-top: 10px;
  color: #ffd34d;
  font-weight: bold;
}

.level-box {
  text-align: center;
  margin-top: 10px;
  color: #9eb6d8;
}

.main-button {
  width: 100%;
  margin-top: 25px;
  padding: 17px;
  border: none;
  border-radius: 15px;
  background: linear-gradient(135deg, #ffb52e, #ff7b18);
  color: white;
  font-size: 19px;
  font-weight: bold;
  box-shadow: 0 8px 20px rgba(255,130,20,.25);
}

.main-button:active {
  transform: scale(.97);
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
}

.stat {
  background: #102b50;
  border: 1px solid #244a78;
  border-radius: 12px;
  padding: 11px 4px;
  text-align: center;
}

.stat-number {
  font-size: 17px;
  font-weight: bold;
}

.stat-name {
  color: #8fa9ca;
  font-size: 11px;
  margin-top: 4px;
}

/* ЭКРАН КЕЙСОВ */

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.back-button {
  background: #173963;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 11px 16px;
  margin-bottom: 15px;
  font-size: 15px;
}

.screen-title {
  font-size: 25px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 18px;
}

.cases {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.case {
  background: #102b50;
  border: 1px solid #244a78;
  border-radius: 15px;
  padding: 15px 8px;
  text-align: center;
  position: relative;
}

.case.locked {
  opacity: .5;
}

.case-icon {
  font-size: 48px;
}

.case-name {
  font-size: 16px;
  font-weight: bold;
  margin-top: 5px;
}

.case-price {
  color: #ffd34d;
  font-size: 14px;
  margin-top: 7px;
}

.case-lock {
  color: #ff9f43;
  font-size: 12px;
  margin-top: 8px;
}

.case-button {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 10px;
  margin-top: 10px;
  background: #315b8c;
  color: white;
  font-weight: bold;
}

.case-button:disabled {
  opacity: .5;
}

/* СУНДУК */

.chest-area {
  height: 180px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.chest {
  width: 170px;
  height: 130px;
  position: relative;
  filter: drop-shadow(0 15px 15px rgba(0,0,0,.4));
}

.chest-body {
  position: absolute;
  width: 170px;
  height: 85px;
  bottom: 0;
  background: linear-gradient(#a85d27, #713716);
  border: 5px solid #49230f;
  border-radius: 8px 8px 14px 14px;
}

.chest-lid {
  position: absolute;
  width: 170px;
  height: 65px;
  top: 0;
  background: linear-gradient(#c87532, #8b451c);
  border: 5px solid #49230f;
  border-radius: 17px 17px 6px 6px;
  transform-origin: left bottom;
  transition: transform .55s cubic-bezier(.2,.8,.2,1);
  z-index: 3;
}

.opened .chest-lid {
  transform: translateY(-48px) rotate(-12deg);
}

.lock {
  position: absolute;
  width: 29px;
  height: 39px;
  background: #e5b82e;
  border: 4px solid #8a6410;
  border-radius: 6px;
  left: 70px;
  top: 49px;
  z-index: 5;
  transition: .2s;
}

.opened .lock {
  opacity: 0;
  transform: scale(.7);
}

.shake {
  animation: shake .45s;
}

@keyframes shake {
  0% { transform: translateX(0); }
  20% { transform: translateX(-7px) rotate(-2deg); }
  40% { transform: translateX(7px) rotate(2deg); }
  60% { transform: translateX(-5px) rotate(-1deg); }
  80% { transform: translateX(5px) rotate(1deg); }
  100% { transform: translateX(0); }
}

/* МОДАЛКА */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.78);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  z-index: 20;
}

.modal.show {
  opacity: 1;
  pointer-events: auto;
}

.modal-box {
  width: 100%;
  max-width: 390px;
  max-height: 90vh;
  overflow-y: auto;
  background: #102b50;
  border: 1px solid #315b8c;
  border-radius: 20px;
  padding: 22px 17px;
  text-align: center;
}

.modal-title {
  font-size: 24px;
  font-weight: bold;
}

.money-reward {
  color: #ffd34d;
  font-size: 28px;
  font-weight: bold;
  margin: 15px 0;
}

.items {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #173963;
  border-radius: 11px;
  padding: 10px;
  text-align: left;
}

.item-image {
  width: 42px;
  height: 42px;
  border-radius: 9px;
  background: #0b213d;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.item-name {
  font-weight: bold;
}

.item-rarity {
  color: #91acd0;
  font-size: 11px;
  margin-top: 3px;
}

.close-button {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #315b8c;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<!-- ГЛАВНЫЙ ЭКРАН -->

<div id="homeScreen" class="screen active">

<h1>💎 Treasure Hunter</h1>

<div class="subtitle">
Охота за сокровищами
</div>

<div class="balance">
💰 <span id="balance">10 000</span>
</div>

<div class="luck" id="luckText">
🍀 До 2× удачи: 10 сундуков
</div>

<div class="level-box">
⭐ Уровень <span id="level">1</span>
</div>

<button class="main-button" onclick="openCasesScreen()">
📦 КЕЙСЫ
</button>

<div class="stats">

<div class="stat">
<div class="stat-number">📦 <span id="opened">0</span></div>
<div class="stat-name">Открыто</div>
</div>

<div class="stat">
<div class="stat-number">⭐ <span id="level2">1</span></div>
<div class="stat-name">Уровень</div>
</div>

<div class="stat">
<div class="stat-number">⚡ <span id="energy">10</span></div>
<div class="stat-name">Энергия</div>
</div>

</div>

</div>


<!-- ЭКРАН КЕЙСОВ -->

<div id="casesScreen" class="screen">

<button class="back-button" onclick="goHome()">
← Назад
</button>

<div class="screen-title">
📦 Кейсы
</div>

<div class="cases">

<div class="case">

<div class="case-icon">📦</div>

<div class="case-name">
Обычный кейс
</div>

<div class="case-price">
2 500 💰
</div>

<button class="case-button"
onclick="openCase(1)">
Открыть
</button>

</div>


<div class="case" id="case2">

<div class="case-icon">💼</div>

<div class="case-name">
Военный кейс
</div>

<div class="case-price">
10 000 💰
</div>

<div class="case-lock" id="lock2">
🔒 5 уровень
</div>

<button class="case-button"
id="button2"
onclick="openCase(2)"
disabled>
Открыть
</button>

</div>


<div class="case" id="case3">

<div class="case-icon">💎</div>

<div class="case-name">
Алмазный кейс
</div>

<div class="case-price">
50 000 💰
</div>

<div class="case-lock" id="lock3">
🔒 10 уровень
</div>

<button class="case-button"
id="button3"
onclick="openCase(3)"
disabled>
Открыть
</button>

</div>


<div class="case" id="case4">

<div class="case-icon">👑</div>

<div class="case-name">
Легендарный кейс
</div>

<div class="case-price">
250 000 💰
</div>

<div class="case-lock" id="lock4">
🔒 20 уровень
</div>

<button class="case-button"
id="button4"
onclick="openCase(4)"
disabled>
Открыть
</button>

</div>

</div>

</div>

</div>


<!-- МОДАЛЬНОЕ ОКНО -->

<div class="modal" id="modal">

<div class="modal-box">

<div class="modal-title" id="modalTitle">
🎉 Кейс открыт!
</div>

<div class="money-reward" id="moneyReward">
+0 💰
</div>

<div class="items" id="items"></div>

<button class="close-button"
onclick="closeModal()">
Забрать награды
</button>

</div>

</div>


<script>

/* =========================
   СОХРАНЕНИЕ
========================= */

let saved =
JSON.parse(localStorage.getItem("treasureHunter"));

let balance = saved ? saved.balance : 10000;
let opened = saved ? saved.opened : 0;
let energy = saved ? saved.energy : 10;
let level = saved ? saved.level : 1;
let totalEarned = saved ? saved.totalEarned : 0;

let luckyActive =
saved ? saved.luckyActive : false;

let luckyProgress =
saved ? saved.luckyProgress : 0;


function saveGame() {

localStorage.setItem(
"treasureHunter",

JSON.stringify({

balance,
opened,
energy,
level,
totalEarned,
luckyActive,
luckyProgress

})

);

}


/* =========================
   КЕЙСЫ
========================= */

const cases = {

1: {
name: "Обычный кейс",
price: 2500,
min: 500,
max: 10000
},

2: {
name: "Военный кейс",
price: 10000,
min: 2000,
max: 50000,
level: 5
},

3: {
name: "Алмазный кейс",
price: 50000,
min: 15000,
max: 200000,
level: 10
},

4: {
name: "Легендарный кейс",
price: 250000,
min: 40000,
max: 1000000,
level: 20
}

};


/* =========================
   ПРЕДМЕТЫ
========================= */

const items = [

{
name: "Старинная монета",
icon: "🪙",
rarity: "Обычный"
},

{
name: "Старый ключ",
icon: "🗝️",
rarity: "Обычный"
},

{
name: "Кристалл",
icon: "💎",
rarity: "Редкий"
},

{
name: "Старая реликвия",
icon: "🏺",
rarity: "Редкий"
},

{
name: "Компас",
icon: "🧭",
rarity: "Эпический"
},

{
name: "Золотая реликвия",
icon: "👑",
rarity: "Легендарный"
}

];


/* =========================
   ЭКРАНЫ
========================= */

function openCasesScreen() {

document.getElementById("homeScreen")
.classList.remove("active");

document.getElementById("casesScreen")
.classList.add("active");

updateCases();

}


function goHome() {

document.getElementById("casesScreen")
.classList.remove("active");

document.getElementById("homeScreen")
.classList.add("active");

}


/* =========================
   ДОСТУП К КЕЙСАМ
========================= */

function updateCases() {

for (let i = 2; i <= 4; i++) {

const data = cases[i];

const button =
document.getElementById("button" + i);

const lock =
document.getElementById("lock" + i);

const box =
document.getElementById("case" + i);


if (level >= data.level) {

button.disabled = false;

lock.style.display = "none";

box.classList.remove("locked");

} else {

button.disabled = true;

lock.style.display = "block";

box.classList.add("locked");

}

}

}


/* =========================
   UI
========================= */

function updateUI() {

document.getElementById("balance")
.textContent = format(balance);

document.getElementById("opened")
.textContent = opened;

document.getElementById("energy")
.textContent = energy;

document.getElementById("level")
.textContent = level;

document.getElementById("level2")
.textContent = level;

updateLuck();

updateCases();

}


function format(number) {

return Math.floor(number)
.toLocaleString("ru-RU");

}


/* =========================
   2X УДАЧА
========================= */

function updateLuck() {

if (luckyActive) {

document.getElementById("luckText")
.textContent = "🍀 2× УДАЧА АКТИВНА!";

return;

}

const left = 10 - luckyProgress;

document.getElementById("luckText")
.textContent =
"🍀 До 2× удачи: " + left + " сундуков";

}


function checkLuck() {

luckyProgress++;

if (luckyProgress >= 10) {

luckyProgress = 0;
luckyActive = true;

}

}


/* =========================
   ОТКРЫТИЕ КЕЙСА
========================= */

function openCase(id) {

const data = cases[id];

if (level < (data.level || 1)) {

alert(
"🔒 Этот кейс открывается на " +
data.level + " уровне!"
);

return;

}

if (balance < data.price) {

alert("Недостаточно денег!");

return;

}

if (energy <= 0) {

alert("Закончилась энергия!");

return;

}


balance -= data.price;

energy--;


const chest =
document.getElementById("chest");

chest.classList.remove("opened");
chest.classList.remove("shake");

void chest.offsetWidth;

chest.classList.add("shake");


setTimeout(function() {

chest.classList.add("opened");

setTimeout(function() {

giveReward(id);

}, 500);

}, 450);

}


/* =========================
   НАГРАДА
========================= */

function giveReward(id) {

const data = cases[id];

let reward =
random(data.min, data.max);


/*
2X удача:
повышаем шанс крупной награды
*/

if (luckyActive) {

if (Math.random() < 0.5) {

reward =
random(
Math.floor(data.max * 0.5),
data.max
);

}

luckyActive = false;

}


/*
Очень редкий максимальный дроп
*/

if (Math.random() < 0.01) {

reward = data.max;

}


balance += reward;

totalEarned += reward;

opened++;


checkLuck();

updateLevel();

showReward(id, reward);

updateUI();

saveGame();

}


/* =========================
   СЛУЧАЙНОЕ ЧИСЛО
========================= */

function random(min, max) {

return Math.floor(
Math.random() * (max - min + 1)
) + min;

}


/* =========================
   УРОВЕНЬ
========================= */

function updateLevel() {

level =
Math.floor(opened / 10) + 1;

}


/* =========================
   НАГРАДА
========================= */

function showReward(id, reward) {

const data = cases[id];

document.getElementById("modalTitle")
.textContent =
"🎉 " + data.name + " открыт!";

document.getElementById("moneyReward")
.textContent =
"+" + format(reward) + " 💰";


const container =
document.getElementById("items");

container.innerHTML = "";


const count = random(2, 5);

const shuffled =
[...items].sort(
() => Math.random() - 0.5
);


for (let i = 0; i < count; i++) {

const item = shuffled[i];

const div =
document.createElement("div");

div.className = "item";

div.innerHTML = `

<div class="item-image">
${item.icon}
</div>

<div>

<div class="item-name">
${item.name}
</div>

<div class="item-rarity">
${item.rarity}
</div>

</div>

`;

container.appendChild(div);

}


setTimeout(function() {

document.getElementById("modal")
.classList.add("show");

}, 100);

}


/* =========================
   ЗАКРЫТИЕ
========================= */

function closeModal() {

document.getElementById("modal")
.classList.remove("show");

const chest =
document.getElementById("chest");

setTimeout(function() {

chest.classList.remove("opened");
chest.classList.remove("shake");

}, 250);

}


/* =========================
   АВТОСОХРАНЕНИЕ
========================= */

window.addEventListener(
"beforeunload",
saveGame
);

updateUI();

</script>

</body>
</html>
