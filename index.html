<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunter</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #07111f, #101b2d);
  color: white;
  min-height: 100vh;
}

button {
  font-family: inherit;
}

.screen {
  min-height: 100vh;
  padding: 18px 16px;
  text-align: center;
}

.hidden {
  display: none !important;
}

/* ===== ВЕРХ ===== */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.balance,
.level-box {
  background: #182840;
  border: 1px solid #294568;
  border-radius: 14px;
  padding: 10px 13px;
  font-weight: bold;
}

.balance {
  font-size: 16px;
}

.level-box {
  font-size: 15px;
}

/* ===== ЗАГОЛОВОК ===== */

h1 {
  margin: 18px 0 4px;
  font-size: 31px;
}

.subtitle {
  color: #8fa8c4;
  margin-bottom: 10px;
}

/* ===== XP ===== */

.xp-box {
  width: 100%;
  max-width: 400px;
  margin: 12px auto 0;
}

.xp-text {
  display: flex;
  justify-content: space-between;
  color: #9bb1c9;
  font-size: 12px;
  margin-bottom: 6px;
}

.xp-bar {
  height: 10px;
  background: #0d1928;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #263d57;
}

.xp-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #4b9cff, #72d6ff);
  border-radius: 10px;
  transition: width .4s ease;
}

/* ===== СУНДУК ===== */

.chest-area {
  height: 310px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.chest {
  position: relative;
  width: 190px;
  height: 155px;
  transition: transform .2s;
}

.chest-body {
  position: absolute;
  left: 0;
  bottom: 0;

  width: 190px;
  height: 110px;

  background: linear-gradient(180deg, #a85d25, #6e3516);
  border: 5px solid #3b1d0b;
  border-radius: 12px;
}

.chest-lid {
  position: absolute;
  left: 0;
  top: 0;

  width: 190px;
  height: 60px;

  background: linear-gradient(180deg, #c97932, #874315);
  border: 5px solid #3b1d0b;
  border-radius: 15px 15px 5px 5px;

  transform-origin: left bottom;
  transition: transform .55s cubic-bezier(.2,.8,.2,1);
  z-index: 2;
}

.lock {
  position: absolute;
  z-index: 5;

  left: 50%;
  top: 55%;

  width: 34px;
  height: 40px;

  transform: translate(-50%, -50%);

  background: #f1bd35;
  border: 4px solid #704707;
  border-radius: 7px;
}

.opened .chest-lid {
  transform: translateY(-52px) rotate(-12deg);
}

.shake {
  animation: shake .35s;
}

@keyframes shake {
  0%,100% {
    transform: translateX(0);
  }

  25% {
    transform: translateX(-8px) rotate(-2deg);
  }

  75% {
    transform: translateX(8px) rotate(2deg);
  }
}

/* ===== КЕЙС ===== */

.case-name {
  font-size: 24px;
  font-weight: bold;
  margin-top: -5px;
}

.case-price {
  color: #ffd84d;
  font-size: 18px;
  font-weight: bold;
  margin-top: 7px;
}

/* ===== ОТКРЫТЬ ===== */

.open-button {
  width: 100%;
  max-width: 290px;

  padding: 16px;
  margin-top: 12px;

  border: 0;
  border-radius: 16px;

  background: linear-gradient(135deg, #ffbd2e, #ff8c00);
  color: #1b1200;

  font-size: 18px;
  font-weight: bold;

  box-shadow: 0 8px 25px rgba(255,157,0,.25);
}

.open-button:active {
  transform: scale(.97);
}

.open-button:disabled {
  opacity: .45;
}

/* ===== СТАТИСТИКА ===== */

.stats {
  margin: 22px auto 0;
  max-width: 420px;

  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.stat {
  background: #111f33;
  border: 1px solid #253d59;
  border-radius: 14px;
  padding: 12px;
}

.stat-title {
  color: #8199b5;
  font-size: 12px;
}

.stat-value {
  font-size: 16px;
  font-weight: bold;
  margin-top: 4px;
}

/* ===== МОДАЛКА ===== */

.modal {
  position: fixed;
  inset: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,.72);
  z-index: 100;

  padding: 20px;
}

.modal-box {
  width: 100%;
  max-width: 390px;

  background: #14253a;
  border: 1px solid #355574;
  border-radius: 24px;

  padding: 22px;
}

.modal-title {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 10px;
}

.reward-money {
  color: #ffd84d;
  font-size: 27px;
  font-weight: bold;
}

.reward-xp {
  color: #72c8ff;
  font-size: 18px;
  font-weight: bold;
  margin-top: 7px;
}

.new-level {
  color: #70ff9a;
  font-size: 18px;
  font-weight: bold;
  margin-top: 8px;
}

.items {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-top: 15px;
}

.item {
  background: #0d1b2d;
  border-radius: 14px;
  padding: 12px;
}

.item-image {
  font-size: 36px;
}

.item-name {
  font-size: 13px;
  margin-top: 5px;
}

.item-rarity {
  color: #819bb6;
  font-size: 11px;
  margin-top: 3px;
}

.close-button {
  width: 100%;
  padding: 14px;
  margin-top: 16px;

  border: 0;
  border-radius: 14px;

  background: #2768a8;
  color: white;

  font-size: 16px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="screen">

  <!-- ВЕРХ -->

  <div class="top">

    <div class="balance">
      💰 <span id="balance">10000</span>
    </div>

    <div class="level-box">
      ⭐ Ур. <span id="level">1</span>
    </div>

  </div>


  <h1>Treasure Hunter</h1>

  <div class="subtitle">
    Открывай кейсы и собирай сокровища!
  </div>


  <!-- XP -->

  <div class="xp-box">

    <div class="xp-text">
      <span>⭐ XP</span>
      <span>
        <span id="xp">0</span> / <span id="xpNeed">1000</span>
      </span>
    </div>

    <div class="xp-bar">
      <div class="xp-fill" id="xpFill"></div>
    </div>

  </div>


  <!-- СУНДУК -->

  <div class="chest-area">

    <div class="chest" id="chest">

      <div class="chest-lid"></div>

      <div class="chest-body"></div>

      <div class="lock"></div>

    </div>

  </div>


  <!-- НАЗВАНИЕ КЕЙСА -->

  <div class="case-name" id="caseName">
    Обычный кейс
  </div>

  <div class="case-price">
    💰 <span id="casePrice">2 500</span>
  </div>


  <!-- ОТКРЫТЬ -->

  <button
    class="open-button"
    id="openButton"
    onclick="openCase()">

    ОТКРЫТЬ КЕЙС

  </button>


  <!-- СТАТИСТИКА -->

  <div class="stats">

    <div class="stat">

      <div class="stat-title">
        Открыто кейсов
      </div>

      <div class="stat-value" id="opened">
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Энергия
      </div>

      <div class="stat-value">
        ⚡ <span id="energy">10</span>/10
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Всего заработано
      </div>

      <div class="stat-value">
        💰 <span id="totalEarned">0</span>
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Удача
      </div>

      <div class="stat-value" id="luck">
        Обычная
      </div>

    </div>

  </div>

</div>


<!-- ===== НАГРАДА ===== -->

<div class="modal hidden" id="rewardModal">

  <div class="modal-box">

    <div class="modal-title">
      🎉 Кейс открыт!
    </div>

    <div class="reward-money">
      +💰 <span id="rewardMoney">0</span>
    </div>

    <div class="reward-xp">
      ⭐ +100 XP
    </div>

    <div class="new-level hidden" id="newLevel">
      🎊 Новый уровень!
    </div>

    <div class="items" id="items"></div>

    <button
      class="close-button"
      onclick="closeReward()">

      ЗАБРАТЬ

    </button>

  </div>

</div>


<script>

/* =========================
   КЕЙСЫ
========================= */

const cases = {

  1: {
    name: "Обычный кейс",
    price: 2500,
    min: 500,
    max: 10000
  },

  2: {
    name: "Военный кейс",
    price: 10000,
    min: 2000,
    max: 50000
  },

  3: {
    name: "Алмазный кейс",
    price: 50000,
    min: 15000,
    max: 200000
  },

  4: {
    name: "Легендарный кейс",
    price: 250000,
    min: 40000,
    max: 1000000
  }

};


/* =========================
   ПРЕДМЕТЫ
========================= */

const itemPool = [

  {
    name: "Монета",
    icon: "🪙",
    rarity: "Обычный"
  },

  {
    name: "Кристалл",
    icon: "💠",
    rarity: "Необычный"
  },

  {
    name: "Золотой слиток",
    icon: "🥇",
    rarity: "Редкий"
  },

  {
    name: "Алмаз",
    icon: "💎",
    rarity: "Эпический"
  },

  {
    name: "Корона",
    icon: "👑",
    rarity: "Легендарный"
  },

  {
    name: "Артефакт",
    icon: "🔮",
    rarity: "Мифический"
  }

];


/* =========================
   СОХРАНЕНИЕ
========================= */

let balance =
  Number(localStorage.getItem("balance")) || 10000;

let opened =
  Number(localStorage.getItem("opened")) || 0;

let energy =
  Number(localStorage.getItem("energy"));

if (isNaN(energy)) {
  energy = 10;
}

let totalEarned =
  Number(localStorage.getItem("totalEarned")) || 0;

let xp =
  Number(localStorage.getItem("xp")) || 0;

let luckyActive =
  localStorage.getItem("luckyActive") === "true";

let luckyProgress =
  Number(localStorage.getItem("luckyProgress")) || 0;


/* =========================
   XP
========================= */

const XP_PER_CASE = 100;
const XP_PER_LEVEL = 1000;


/* =========================
   УРОВЕНЬ
========================= */

function getLevel() {

  return Math.floor(xp / XP_PER_LEVEL) + 1;

}


/* =========================
   КАКОЙ КЕЙС ДОСТУПЕН
========================= */

function getCurrentCase() {

  const level = getLevel();

  if (level >= 20) {
    return 4;
  }

  if (level >= 10) {
    return 3;
  }

  if (level >= 5) {
    return 2;
  }

  return 1;

}


/* =========================
   СОХРАНЕНИЕ
========================= */

function save() {

  localStorage.setItem(
    "balance",
    balance
  );

  localStorage.setItem(
    "opened",
    opened
  );

  localStorage.setItem(
    "energy",
    energy
  );

  localStorage.setItem(
    "totalEarned",
    totalEarned
  );

  localStorage.setItem(
    "xp",
    xp
  );

  localStorage.setItem(
    "luckyActive",
    luckyActive
  );

  localStorage.setItem(
    "luckyProgress",
    luckyProgress
  );

}


/* =========================
   ОБНОВЛЕНИЕ
========================= */

function updateUI() {

  const level = getLevel();

  const currentCaseId =
    getCurrentCase();

  const currentCase =
    cases[currentCaseId];


  document.getElementById("balance")
    .textContent =
    balance.toLocaleString("ru-RU");


  document.getElementById("level")
    .textContent =
    level;


  document.getElementById("xp")
    .textContent =
    xp % XP_PER_LEVEL;


  document.getElementById("xpNeed")
    .textContent =
    XP_PER_LEVEL;


  const xpPercent =
    ((xp % XP_PER_LEVEL) /
    XP_PER_LEVEL) * 100;


  document.getElementById("xpFill")
    .style.width =
    xpPercent + "%";


  document.getElementById("caseName")
    .textContent =
    currentCase.name;


  document.getElementById("casePrice")
    .textContent =
    currentCase.price.toLocaleString("ru-RU");


  document.getElementById("opened")
    .textContent =
    opened;


  document.getElementById("energy")
    .textContent =
    energy;


  document.getElementById("totalEarned")
    .textContent =
    totalEarned.toLocaleString("ru-RU");


  document.getElementById("luck")
    .textContent =
    luckyActive
      ? "🔥 2× удача"
      : "Обычная";


  const button =
    document.getElementById("openButton");


  button.disabled =
    balance < currentCase.price ||
    energy <= 0;

}


/* =========================
   СЛУЧАЙНОЕ ЧИСЛО
========================= */

function randomInt(min, max) {

  return Math.floor(
    Math.random() *
    (max - min + 1)
  ) + min;

}


/* =========================
   ОТКРЫТИЕ
========================= */

function openCase() {

  const caseId =
    getCurrentCase();

  const currentCase =
    cases[caseId];


  if (balance < currentCase.price) {

    alert("Недостаточно денег!");

    return;

  }


  if (energy <= 0) {

    alert("Закончилась энергия!");

    return;

  }


  const oldLevel =
    getLevel();


  /* Оплата кейса */

  balance -= currentCase.price;

  energy--;


  /* Награда */

  let reward;


  if (luckyActive) {

    reward = randomInt(
      Math.ceil(
        (currentCase.min +
        currentCase.max) / 2
      ),
      currentCase.max
    );

    luckyActive = false;

  } else {

    reward = randomInt(
      currentCase.min,
      currentCase.max
    );

  }


  /* 1% шанс максимальной награды */

  if (Math.random() < 0.01) {

    reward = currentCase.max;

  }


  balance += reward;

  totalEarned += reward;


  /* Статистика */

  opened++;


  /* XP */

  xp += XP_PER_CASE;


  /* Удача */

  luckyProgress++;


  if (luckyProgress >= 10) {

    luckyActive = true;

    luckyProgress = 0;

  }


  const newLevel =
    getLevel();


  save();

  updateUI();


  /* Анимация сундука */

  const chest =
    document.getElementById("chest");


  chest.classList.remove("shake");
  chest.classList.remove("opened");


  void chest.offsetWidth;


  chest.classList.add("shake");


  setTimeout(() => {

    chest.classList.add("opened");

  }, 350);


  /* Награда */

  showReward(
    reward,
    newLevel > oldLevel
  );

}


/* =========================
   НАГРАДА
========================= */

function showReward(
  reward,
  leveledUp
) {

  document.getElementById("rewardMoney")
    .textContent =
    reward.toLocaleString("ru-RU");


  const levelMessage =
    document.getElementById("newLevel");


  if (leveledUp) {

    levelMessage.textContent =
      "🎊 Уровень повышен! Теперь " +
      getLevel() +
      " уровень";

    levelMessage.classList.remove(
      "hidden"
    );

  } else {

    levelMessage.classList.add(
      "hidden"
    );

  }


  const items =
    document.getElementById("items");

  items.innerHTML = "";


  const count =
    randomInt(2, 5);


  const used = [];


  while (used.length < count) {

    const item =
      itemPool[
        randomInt(
          0,
          itemPool.length - 1
        )
      ];


    if (!used.includes(item)) {

      used.push(item);

    }

  }


  used.forEach(item => {

    const div =
      document.createElement("div");


    div.className = "item";


    div.innerHTML = `

      <div class="item-image">
        ${item.icon}
      </div>

      <div class="item-name">
        ${item.name}
      </div>

      <div class="item-rarity">
        ${item.rarity}
      </div>

    `;


    items.appendChild(div);

  });


  document.getElementById(
    "rewardModal"
  ).classList.remove("hidden");

}


/* =========================
   ЗАКРЫТЬ НАГРАДУ
========================= */

function closeReward() {

  document.getElementById(
    "rewardModal"
  ).classList.add("hidden");


  const chest =
    document.getElementById("chest");


  chest.classList.remove("opened");
  chest.classList.remove("shake");

}


/* =========================
   ЗАПУСК
========================= */

updateUI();

</script>

</body>
</html>
