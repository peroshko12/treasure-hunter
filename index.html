<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunter</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(circle at top, #102b49, #050b14 70%);
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

.app {
  max-width: 500px;
  margin: auto;
  padding: 18px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-size: 23px;
  font-weight: 900;
}

.balance {
  background: #142a43;
  padding: 10px 14px;
  border-radius: 14px;
  font-weight: bold;
}

.location {
  text-align: center;
  margin-top: 30px;
  color: #91a8c0;
  font-size: 13px;
}

.place {
  text-align: center;
  font-size: 27px;
  font-weight: 900;
  margin-top: 6px;
}

/* Место для сундука */

.chest-area {
  height: 340px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Свечение */

.glow {
  position: absolute;
  width: 230px;
  height: 150px;
  background: #f5b942;
  border-radius: 50%;
  filter: blur(65px);
  opacity: 0.22;
}

/* Сундук */

.chest {
  width: 190px;
  height: 135px;
  position: relative;
  cursor: pointer;
  transition: transform 0.15s;
  filter: drop-shadow(0 18px 15px rgba(0,0,0,0.5));
}

.chest:hover {
  transform: scale(1.04);
}

/* Нижняя часть */

.chest-body {
  position: absolute;
  bottom: 0;
  width: 190px;
  height: 95px;
  background: linear-gradient(#a85b22, #6e3515);
  border: 6px solid #43200d;
  border-radius: 8px 8px 15px 15px;
}

/* Деревянные полосы */

.chest-body::before {
  content: "";
  position: absolute;
  left: 20px;
  right: 20px;
  top: 18px;
  height: 9px;
  background: #d28a36;
  border-radius: 5px;
  box-shadow: 0 30px #d28a36;
}

/* Крышка */

.chest-lid {
  position: absolute;
  top: 5px;
  left: 0;
  width: 190px;
  height: 75px;
  background: linear-gradient(#c8752b, #8c4519);
  border: 6px solid #43200d;
  border-radius: 95px 95px 10px 10px;
  transform-origin: bottom center;
  transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
  z-index: 3;
}

/* Металл */

.chest-lid::before {
  content: "";
  position: absolute;
  left: 18px;
  right: 18px;
  top: 18px;
  height: 8px;
  background: #e0a43a;
  border-radius: 5px;
}

/* Замок */

.lock {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 58px;
  transform: translateX(-50%);
  width: 34px;
  height: 42px;
  background: #f0bd45;
  border: 4px solid #6c410e;
  border-radius: 6px;
  transition: opacity 0.25s;
}

.lock::before {
  content: "";
  position: absolute;
  left: 6px;
  top: -22px;
  width: 14px;
  height: 19px;
  border: 5px solid #6c410e;
  border-bottom: 0;
  border-radius: 12px 12px 0 0;
}

/* Анимация тряски */

.shake {
  animation: shake 0.12s infinite;
}

@keyframes shake {
  0% { transform: rotate(0deg); }
  25% { transform: rotate(-4deg); }
  50% { transform: rotate(4deg); }
  75% { transform: rotate(-3deg); }
  100% { transform: rotate(0deg); }
}

/* Открытие */

.opened .chest-lid {
  transform: rotateX(-125deg);
}

.opened .lock {
  opacity: 0;
}

/* Свет после открытия */

.flash {
  position: absolute;
  width: 30px;
  height: 30px;
  background: white;
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
}

.flash.show {
  animation: flash 0.8s ease-out;
}

@keyframes flash {
  0% {
    transform: scale(1);
    opacity: 0.9;
  }

  100% {
    transform: scale(12);
    opacity: 0;
  }
}

/* Награда */

.reward {
  position: absolute;
  top: 45px;
  text-align: center;
  opacity: 0;
  transform: translateY(20px) scale(0.7);
  pointer-events: none;
}

.reward.show {
  animation: reward 0.8s forwards;
}

.reward-icon {
  font-size: 70px;
}

.reward-text {
  font-size: 20px;
  font-weight: 900;
  margin-top: 5px;
}

@keyframes reward {
  0% {
    opacity: 0;
    transform: translateY(30px) scale(0.6);
  }

  60% {
    opacity: 1;
    transform: translateY(-10px) scale(1.15);
  }

  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Кнопка */

.open {
  width: 100%;
  padding: 18px;
  border: 0;
  border-radius: 18px;
  background: linear-gradient(135deg, #ffc94f, #e99a20);
  color: #241600;
  font-size: 20px;
  font-weight: 900;
  box-shadow: 0 8px 20px rgba(244,185,66,0.25);
}

.open:active {
  transform: scale(0.97);
}

/* Статы */

.stats {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.stat {
  flex: 1;
  background: #101f32;
  padding: 14px;
  border-radius: 15px;
  text-align: center;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="title">💎 Treasure Hunter</div>
    <div class="balance">💰 10 000</div>
  </div>

  <div class="location">
    ТЕКУЩАЯ ЛОКАЦИЯ
  </div>

  <div class="place">
    🏝️ Старый пляж
  </div>

  <div class="chest-area">

    <div class="glow"></div>

    <div class="chest" id="chest">

      <div class="chest-lid"></div>

      <div class="chest-body"></div>

      <div class="lock"></div>

    </div>

    <div class="flash" id="flash"></div>

    <div class="reward" id="reward">
      <div class="reward-icon">🪙</div>
      <div class="reward-text">Старые монеты</div>
    </div>

  </div>

  <button class="open" onclick="openChest()">
    🎁 ОТКРЫТЬ СУНДУК
  </button>

  <div class="stats">
    <div class="stat">⚡ 10/10</div>
    <div class="stat">📈 Ур. 1</div>
    <div class="stat">🔎 0</div>
  </div>

</div>

<script>

let opened = false;

function openChest() {

  if (opened) return;

  opened = true;

  const chest = document.getElementById("chest");
  const flash = document.getElementById("flash");
  const reward = document.getElementById("reward");

  // Сундук трясётся
  chest.classList.add("shake");

  // Через 1 секунду открываем
  setTimeout(() => {

    chest.classList.remove("shake");

    chest.classList.add("opened");

    // Вспышка
    setTimeout(() => {
      flash.classList.add("show");
    }, 350);

    // Награда
    setTimeout(() => {
      reward.classList.add("show");
    }, 500);

  }, 1000);

}

</script>

</body>
</html>
