<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Treasure Hunter</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(160deg, #081a2e, #06101d);
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  max-width: 500px;
  margin: auto;
  padding: 18px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-size: 22px;
  font-weight: 900;
}

.balance {
  background: #142a41;
  padding: 10px 13px;
  border-radius: 14px;
  font-weight: bold;
}

.location {
  text-align: center;
  margin-top: 30px;
  color: #91a6ba;
  font-size: 12px;
}

.place {
  text-align: center;
  font-size: 26px;
  font-weight: 900;
  margin-top: 6px;
}

/* СУНДУК */

.chest-area {
  height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chest {
  width: 190px;
  height: 145px;
  position: relative;
  filter: drop-shadow(0 15px 15px rgba(0,0,0,.5));
}

.chest-body {
  position: absolute;
  bottom: 0;
  width: 190px;
  height: 95px;
  background: linear-gradient(#a85c25, #683512);
  border: 6px solid #32180a;
  border-radius: 8px 8px 15px 15px;
}

.chest-lid {
  position: absolute;
  top: 2px;
  left: 0;
  width: 190px;
  height: 75px;
  background: linear-gradient(#c8792d, #814218);
  border: 6px solid #32180a;
  border-radius: 100px 100px 10px 10px;
  transform-origin: bottom center;
  transition: transform .7s;
  z-index: 3;
}

.chest-lid:after {
  content: "";
  position: absolute;
  left: 20px;
  right: 20px;
  top: 18px;
  height: 8px;
  background: #e1a23d;
  border-radius: 5px;
}

.lock {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 58px;
  transform: translateX(-50%);
  width: 34px;
  height: 42px;
  background: #f1bd43;
  border: 4px solid #65400e;
  border-radius: 6px;
}

.opened .chest-lid {
  transform: rotateX(-120deg);
}

.shake {
  animation: shake .12s infinite;
}

@keyframes shake {
  0% { transform: rotate(0); }
  25% { transform: rotate(-4deg); }
  50% { transform: rotate(4deg); }
  75% { transform: rotate(-3deg); }
  100% { transform: rotate(0); }
}

/* КНОПКА */

.open {
  width: 100%;
  padding: 18px;
  border: 0;
  border-radius: 18px;
  background: linear-gradient(135deg, #ffc94f, #e99a20);
  color: #241600;
  font-size: 19px;
  font-weight: 900;
}

.open:active {
  transform: scale(.97);
}

/* СТАТИСТИКА */

.stats {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.stat {
  flex: 1;
  background: #102238;
  padding: 14px 5px;
  border-radius: 14px;
  text-align: center;
  font-size: 13px;
}

/* ОКНО НАГРАД */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.box {
  width: 100%;
  max-width: 390px;
  background: #10243a;
  border-radius: 22px;
  padding: 22px;
  text-align: center;
}

.box h2 {
  margin-top: 0;
}

.rewards {
  margin-top: 15px;
}

.reward {
  display: flex;
  justify-content: space-between;
  background: #0b1929;
  padding: 12px;
  margin-top: 8px;
  border-radius: 12px;
}

.close {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  background: #29435d;
  color: white;
  font-size: 17px
