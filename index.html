<script>

const API_URL =
"https://lpddqgqgucrlzwriadfh.supabase.co/functions/v1/smart-responder";

const tg =
window.Telegram?.WebApp;

if(tg){
    tg.ready();
    tg.expand();
}

const telegramUser =
tg?.initDataUnsafe?.user;

const userId =
telegramUser?.id
? String(telegramUser.id)
: "";

const username =
telegramUser?.username || "";


const cases={

1:{
name:"Обычный кейс",
shortName:"Обычный",
className:"normal",
price:2500,
min:500,
max:10000
},

2:{
name:"Военный кейс",
shortName:"Военный",
className:"military",
price:10000,
min:2000,
max:50000
},

3:{
name:"Алмазный кейс",
shortName:"Алмазный",
className:"diamond",
price:50000,
min:15000,
max:200000
},

4:{
name:"Легендарный кейс",
shortName:"Легендарный",
className:"legendary",
price:250000,
min:40000,
max:1000000
}

};


const itemPool=[

{
name:"Монета",
icon:"🪙",
rarity:"Обычный",
rarityLevel:1,
rarityClass:"rarity-common"
},

{
name:"Кристалл",
icon:"💠",
rarity:"Необычный",
rarityLevel:2,
rarityClass:"rarity-uncommon"
},

{
name:"Золотой слиток",
icon:"🥇",
rarity:"Редкий",
rarityLevel:3,
rarityClass:"rarity-rare"
},

{
name:"Алмаз",
icon:"💎",
rarity:"Эпический",
rarityLevel:4,
rarityClass:"rarity-epic"
},

{
name:"Корона",
icon:"👑",
rarity:"Легендарный",
rarityLevel:5,
rarityClass:"rarity-legendary"
},

{
name:"Артефакт",
icon:"🔮",
rarity:"Мифический",
rarityLevel:6,
rarityClass:"rarity-mythic"
}

];


const XP_PER_CASE=15;
const XP_PER_LEVEL=1000;


let balance=
Number(localStorage.getItem("balance"))||10000;

let opened=
Number(localStorage.getItem("opened"))||0;

let totalEarned=
Number(localStorage.getItem("totalEarned"))||0;

let xp=
Number(localStorage.getItem("xp"))||0;

let luckyActive=
localStorage.getItem("luckyActive")==="true";

let luckyProgress=
Number(localStorage.getItem("luckyProgress"))||0;


/* =========================
   SUPABASE
========================= */

async function serverRequest(action,amount=0){

if(!userId){

throw new Error(
"Игра должна быть открыта через Telegram"
);

}

const response=
await fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:action,

amount:amount,

userId:userId,

username:username

})

});

const data=
await response.json();

if(!response.ok || data.success===false){

throw new Error(
data.error || "Ошибка сервера"
);

}

return data;

}


async function loadBalance(){

try{

const data=
await serverRequest(
"get_balance"
);

balance=
Number(data.balance);

localStorage.setItem(
"balance",
balance
);

updateUI();

}catch(error){

console.error(error);

updateUI();

}

}


/* =========================
   LEVEL
========================= */

function getLevel(){

return Math.floor(
xp/XP_PER_LEVEL
)+1;

}


function getCurrentCase(){

const level=getLevel();

if(level>=20)return 4;

if(level>=10)return 3;

if(level>=5)return 2;

return 1;

}


/* =========================
   MENU
========================= */

function toggleMenu(){

document
.getElementById("menu")
.classList.toggle("open");

document
.getElementById("menuOverlay")
.classList.toggle("hidden");

}


function closeMenu(){

document
.getElementById("menu")
.classList.remove("open");

document
.getElementById("menuOverlay")
.classList.add("hidden");

}


function hideAllScreens(){

document
.getElementById("homeScreen")
.classList.add("hidden");

document
.getElementById("battlePassScreen")
.classList.add("hidden");

document
.getElementById("settingsScreen")
.classList.add("hidden");

document
.getElementById("upgraderScreen")
.classList.add("hidden");

}


function showHome(){

hideAllScreens();

document
.getElementById("homeScreen")
.classList.remove("hidden");

closeMenu();

updateUI();

}


function openSettings(){

hideAllScreens();

document
.getElementById("settingsScreen")
.classList.remove("hidden");

closeMenu();

}


function openBattlePass(){

hideAllScreens();

document
.getElementById("battlePassScreen")
.classList.remove("hidden");

closeMenu();

renderBattlePass();

}


function openUpgrader(){

hideAllScreens();

document
.getElementById("upgraderScreen")
.classList.remove("hidden");

closeMenu();

}


/* =========================
   SAVE LOCAL STATS
========================= */

function save(){

localStorage.setItem(
"balance",
balance
);

localStorage.setItem(
"opened",
opened
);

localStorage.setItem(
"totalEarned",
totalEarned
);

localStorage.setItem(
"xp",
xp
);

localStorage.setItem(
"luckyActive",
luckyActive
);

localStorage.setItem(
"luckyProgress",
luckyProgress
);

}


/* =========================
   BATTLE PASS
========================= */

function getReward(level){

if(level===5)
return"🪖 Военный кейс";

if(level===10)
return"💎 Алмазный кейс";

if(level===20)
return"👑 Легендарный кейс";

return"💰 "+
(level*1000).toLocaleString("ru-RU");

}


function renderBattlePass(){

const container=
document.getElementById("passProgress");

const level=getLevel();

container.innerHTML="";

const maxLevel=
Math.max(20,level+5);

for(
let i=1;
i<=maxLevel;
i++
){

const card=
document.createElement("div");

card.className="pass-card";

if(i<level)
card.classList.add("done");

if(i===level)
card.classList.add("current");

let status="🔒";

if(i<level)
status="✅ Получено";

if(i===level)
status="⭐ Сейчас";

card.innerHTML=`

<div class="pass-level">
${i}
</div>

<div class="pass-reward">

<div class="pass-reward-title">
Награда
</div>

<div class="pass-reward-value">
${getReward(i)}
</div>

</div>

<div class="pass-status">
${status}
</div>

`;

container.appendChild(card);

}

}


/* =========================
   LEVEL REWARD
========================= */

async function giveLevelReward(level){

if(
level===5||
level===10||
level===20
){

return 0;

}

const reward=
level*1000;

try{

await serverRequest(
"change_balance",
reward
);

balance+=reward;

totalEarned+=reward;

return reward;

}catch(error){

console.error(error);

return 0;

}

}


/* =========================
   UI
========================= */

function updateUI(){

const level=getLevel();

const caseId=getCurrentCase();

const currentCase=cases[caseId];

document.getElementById("balance")
.textContent=
balance.toLocaleString("ru-RU");

document.getElementById("level")
.textContent=level;

document.getElementById("levelStat")
.textContent=level;

document.getElementById("xp")
.textContent=
xp%XP_PER_LEVEL;

document.getElementById("xpNeed")
.textContent=
XP_PER_LEVEL;

document.getElementById("xpFill")
.style.width=
((xp%XP_PER_LEVEL)/
XP_PER_LEVEL*100)+"%";

document.getElementById("luckProgress")
.textContent=
luckyProgress;

document.getElementById("luckFill")
.style.width=
(luckyProgress*10)+"%";

const luckText=
document.getElementById("luckText");

if(luckyActive){

luckText.textContent=
"🔥 2× удача активна!";

luckText.classList.add("luck-active");

}else{

luckText.textContent=
"🍀 2× удача";

luckText.classList.remove("luck-active");

}

document.getElementById("caseName")
.textContent=
currentCase.name;

document.getElementById("casePrice")
.textContent=
currentCase.price
.toLocaleString("ru-RU");

document.getElementById("caseStat")
.textContent=
currentCase.shortName;

document.getElementById("opened")
.textContent=
opened;

document.getElementById("totalEarned")
.textContent=
totalEarned
.toLocaleString("ru-RU");

const chest=
document.getElementById("chest");

chest.className=
"chest "+
currentCase.className;

document.getElementById("openButton")
.disabled=
balance<currentCase.price;

}


/* =========================
   REWARD
========================= */

function randomInt(min,max){

return Math.floor(
Math.random()*
(max-min+1)
)+min;

}


function calculateReward(currentCase){

const roll=Math.random();

let multiplier;

if(roll<0.45){

multiplier=
0.35+
Math.random()*0.25;

}

else if(roll<0.75){

multiplier=
0.60+
Math.random()*0.30;

}

else if(roll<0.92){

multiplier=
0.90+
Math.random()*0.50;

}

else if(roll<0.99){

multiplier=
1.40+
Math.random()*1.60;

}

else{

multiplier=
3+
Math.random()*7;

}

let reward=
Math.floor(
currentCase.price*
multiplier
);

reward=Math.max(
currentCase.min,
reward
);

reward=Math.min(
currentCase.max,
reward
);

if(luckyActive){

reward=randomInt(
Math.ceil(
currentCase.price*0.9
),
currentCase.max
);

luckyActive=false;

}

return reward;

}


function getItems(){

const result=[];

const rarityRoll=()=>{

const r=
Math.random()*100;

if(r<50)return 1;

if(r<75)return 2;

if(r<89)return 3;

if(r<96)return 4;

if(r<99)return 5;

return 6;

};

const count=
randomInt(2,5);

while(result.length<count){

const rarity=
rarityRoll();

const possible=
itemPool.filter(
item=>
item.rarityLevel===rarity
);

const item=
possible[
randomInt(
0,
possible.length-1
)
];

result.push(item);

}

return result;

}


/* =========================
   OPEN CASE
========================= */

async function openCase(){

const button=
document.getElementById("openButton");

if(button.disabled)
return;

const caseId=
getCurrentCase();

const currentCase=
cases[caseId];

if(balance<currentCase.price){

alert(
"Недостаточно серебра для открытия кейса!"
);

return;

}

button.disabled=true;


/* ЗВУК */

const sound=
document.getElementById("sound-open");

if(sound){

sound.currentTime=0;

sound.play().catch(
()=>{}
);

}


/* СНАЧАЛА СПИСЫВАЕМ СЕРЕБРО */

try{

await serverRequest(
"change_balance",
-currentCase.price
);

balance-=currentCase.price;

}catch(error){

button.disabled=false;

alert(
"Ошибка соединения с сервером"
);

console.error(error);

return;

}


const oldLevel=
getLevel();

const reward=
calculateReward(currentCase);


/* НАЧИСЛЯЕМ НАГРАДУ */

try{

await serverRequest(
"change_balance",
reward
);

balance+=reward;

}catch(error){

/* Возвращаем списанное */

try{

await serverRequest(
"change_balance",
currentCase.price
);

}catch(e){}

button.disabled=false;

alert(
"Ошибка при сохранении награды"
);

console.error(error);

return;

}


totalEarned+=reward;

const items=
getItems();

const highestItem=
items.reduce(
(best,item)=>
item.rarityLevel>
best.rarityLevel
?item
:best
);

opened++;

xp+=XP_PER_CASE;

if(!luckyActive){

luckyProgress++;

}

if(luckyProgress>=10){

luckyActive=true;

luckyProgress=0;

}


const newLevel=
getLevel();


/* НАГРАДЫ ЗА УРОВНИ */

if(newLevel>oldLevel){

for(
let lvl=oldLevel+1;
lvl<=newLevel;
lvl++
){

await giveLevelReward(lvl);

}

}


save();

updateUI();


const chest=
document.getElementById("chest");

chest.classList.remove("shake");
chest.classList.remove("opened");

chest.classList.remove("glow-common");
chest.classList.remove("glow-uncommon");
chest.classList.remove("glow-rare");
chest.classList.remove("glow-epic");
chest.classList.remove("glow-legendary");
chest.classList.remove("glow-mythic");

void chest.offsetWidth;

chest.classList.add("shake");


setTimeout(()=>{

chest.classList.add(
"glow-"+
getRarityClassName(
highestItem.rarityLevel
)
);

},220);


setTimeout(()=>{

chest.classList.add("opened");

},450);


setTimeout(()=>{

showReward(
reward,
items,
highestItem,
newLevel>oldLevel
);

button.disabled=false;

},700);

}


/* =========================
   RARITY
========================= */

function getRarityClassName(level){

if(level===1)
return"common";

if(level===2)
return"uncommon";

if(level===3)
return"rare";

if(level===4)
return"epic";

if(level===5)
return"legendary";

return"mythic";

}


/* =========================
   REWARD WINDOW
========================= */

function showReward(
reward,
items,
highestItem,
leveledUp
){

document.getElementById("rewardMoney")
.textContent=
reward.toLocaleString("ru-RU");

const levelMessage=
document.getElementById("newLevel");

if(leveledUp){

levelMessage.textContent=
"🎊 Новый уровень! Ур. "+
getLevel();

levelMessage.classList.remove(
"hidden"
);

}else{

levelMessage.classList.add(
"hidden"
);

}

const rarityResult=
document.getElementById(
"rarityResult"
);

rarityResult.textContent=
"✨ Лучшая редкость: "+
highestItem.rarity;

rarityResult.className=
"rarity-result "+
highestItem.rarityClass;

const container=
document.getElementById("items");

container.innerHTML="";

items.forEach(item=>{

const div=
document.createElement("div");

div.className="item";

div.innerHTML=`

<div class="item-image">
${item.icon}
</div>

<div class="item-name">
${item.name}
</div>

<div class="item-rarity ${item.rarityClass}">
${item.rarity}
</div>

`;

container.appendChild(div);

});

document.getElementById("rewardModal")
.classList.remove("hidden");

}


function closeReward(){

document.getElementById("rewardModal")
.classList.add("hidden");

const chest=
document.getElementById("chest");

chest.classList.remove("opened");
chest.classList.remove("shake");

}


/* =========================
   START
========================= */

updateUI();

loadBalance();

</script>
