<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunter</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #07111f, #101b2d);
  color: white;
  min-height: 100vh;
}

button {
  font-family: inherit;
}

.screen {
  min-height: 100vh;
  padding: 20px 16px;
  text-align: center;
}

.hidden {
  display: none !important;
}

/* ===== ГЛАВНЫЙ ЭКРАН ===== */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.balance {
  background: #182840;
  border: 1px solid #294568;
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 17px;
  font-weight: bold;
}

.level {
  background: #182840;
  border: 1px solid #294568;
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 15px;
}

h1 {
  margin: 15px 0 4px;
  font-size: 32px;
}

.subtitle {
  color: #8fa8c4;
  margin-bottom: 20px;
}

/* ===== СЛОТ КЕЙСА ===== */

.case-area {
  position: relative;
  width: 100%;
  max-width: 420px;
  margin: 10px auto 0;
  min-height: 430px;

  display: flex;
  justify-content: center;
  align-items: center;
}

/* ===== КНОПКА КЕЙСОВ ===== */

.cases-button {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);

  width: 58px;
  height: 58px;

  border: 1px solid #365578;
  border-radius: 18px;

  background: #14253a;
  color: white;

  font-size: 24px;
  cursor: pointer;

  box-shadow: 0 8px 20px rgba(0,0,0,.25);
}

.cases-button span {
  display: block;
  font-size: 10px;
  margin-top: 2px;
  color: #9db4cc;
}

.cases-button:active {
  transform: translateY(-50%) scale(.94);
}

/* ===== ВЫБРАННЫЙ КЕЙС ===== */

.selected-case {
  width: 250px;
  padding: 22px 16px;

  background: linear-gradient(180deg, #162b45, #0e1d31);
  border: 1px solid #345677;
  border-radius: 24px;

  box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

.case-icon {
  font-size: 80px;
  margin-bottom: 10px;
}

.case-name {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 8px;
}

.case-price {
  color: #ffd84d;
  font-size: 18px;
  font-weight: bold;
}

/* ===== КНОПКА ОТКРЫТИЯ ===== */

.open-button {
  width: 100%;
  max-width: 280px;
  padding: 16px;
  margin-top: -25px;

  border: 0;
  border-radius: 16px;

  background: linear-gradient(135deg, #ffbd2e, #ff8c00);
  color: #1b1200;

  font-size: 18px;
  font-weight: bold;

  cursor: pointer;
  box-shadow: 0 8px 25px rgba(255,157,0,.25);
}

.open-button:active {
  transform: scale(.97);
}

.open-button:disabled {
  opacity: .45;
}

/* ===== СТАТИСТИКА ===== */

.stats {
  margin: 24px auto 0;
  max-width: 420px;

  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.stat {
  background: #111f33;
  border: 1px solid #253d59;
  border-radius: 14px;
  padding: 13px;
}

.stat-title {
  color: #8199b5;
  font-size: 12px;
}

.stat-value {
  font-size: 17px;
  font-weight: bold;
  margin-top: 4px;
}

/* ===== ЭКРАН КЕЙСОВ ===== */

.cases-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
}

.back-button {
  width: 44px;
  height: 44px;

  border: 1px solid #294568;
  border-radius: 13px;

  background: #162840;
  color: white;
  font-size: 20px;
}

.cases-title {
  flex: 1;
  text-align: left;
  font-size: 25px;
  font-weight: bold;
}

.case-list {
  max-width: 500px;
  margin: auto;

  display: grid;
  gap: 12px;
}

.case-card {
  position: relative;

  display: flex;
  align-items: center;
  gap: 14px;

  padding: 16px;

  background: #14253a;
  border: 1px solid #2d4865;
  border-radius: 18px;

  text-align: left;
}

.case-card.locked {
  opacity: .48;
}

.case-card-icon {
  font-size: 42px;
  width: 55px;
  text-align: center;
}

.case-card-info {
  flex: 1;
}

.case-card-name {
  font-size: 18px;
  font-weight: bold;
}

.case-card-price {
  color: #ffd84d;
  margin-top: 5px;
}

.lock-text {
  font-size: 13px;
  color: #a6b8ca;
  margin-top: 5px;
}

.select-case {
  border: 0;
  border-radius: 11px;
  padding: 10px 12px;

  background: #2768a8;
  color: white;

  font-weight: bold;
}

.select-case:active {
  transform: scale(.95);
}

/* ===== СУНДУК ===== */

.chest-area {
  position: absolute;
  left: 50%;
  top: 55%;
  transform: translate(-50%, -50%);
  display: none;
}

.chest {
  position: relative;
  width: 180px;
  height: 145px;
}

.chest-body {
  position: absolute;
  left: 0;
  bottom: 0;

  width: 180px;
  height: 105px;

  background: linear-gradient(180deg, #a85d25, #6e3516);
  border: 5px solid #3b1d0b;
  border-radius: 12px;
}

.chest-lid {
  position: absolute;
  left: 0;
  top: 0;

  width: 180px;
  height: 55px;

  background: linear-gradient(180deg, #c97932, #874315);
  border: 5px solid #3b1d0b;
  border-radius: 14px 14px 5px 5px;

  transform-origin: left bottom;
  transition: transform .55s cubic-bezier(.2,.8,.2,1);
  z-index: 2;
}

.lock {
  position: absolute;
  z-index: 5;

  left: 50%;
  top: 50%;

  width: 32px;
  height: 38px;

  transform: translate(-50%, -50%);

  background: #f1bd35;
  border: 4px solid #704707;
  border-radius: 7px;
}

.opened .chest-lid {
  transform: translateY(-48px) rotate(-12deg);
}

.shake {
  animation: shake .35s;
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-8px) rotate(-2deg); }
  75% { transform: translateX(8px) rotate(2deg); }
}

/* ===== МОДАЛКА ===== */

.modal {
  position: fixed;
  inset: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,.7);
  z-index: 100;
  padding: 20px;
}

.modal-box {
  width: 100%;
  max-width: 390px;

  background: #14253a;
  border: 1px solid #355574;
  border-radius: 24px;

  padding: 22px;

  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.modal-title {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 15px;
}

.reward-money {
  color: #ffd84d;
  font-size: 27px;
  font-weight: bold;
  margin-bottom: 15px;
}

.items {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.item {
  background: #0d1b2d;
  border-radius: 14px;
  padding: 12px;
}

.item-image {
  font-size: 36px;
}

.item-name {
  font-size: 13px;
  margin-top: 5px;
}

.item-rarity {
  color: #819bb6;
  font-size: 11px;
  margin-top: 3px;
}

.close-button {
  width: 100%;
  padding: 14px;
  margin-top: 16px;

  border: 0;
  border-radius: 14px;

  background: #2768a8;
  color: white;

  font-size: 16px;
  font-weight: bold;
}

/* ===== МОБИЛКА ===== */

@media (max-width: 380px) {
  .case-area {
    min-height: 390px;
  }

  .selected-case {
    width: 220px;
  }

  .cases-button {
    width: 52px;
    height: 52px;
  }
}
</style>
</head>

<body>

<!-- ===== ГЛАВНЫЙ ЭКРАН ===== -->

<div class="screen" id="homeScreen">

  <div class="top">
    <div class="balance">💰 <span id="balance">10000</span></div>
    <div class="level">⭐ Ур. <span id="level">1</span></div>
  </div>

  <h1>Treasure Hunter</h1>
  <div class="subtitle">Открывай кейсы и собирай сокровища!</div>

  <div class="case-area">

    <!-- КЕЙС ПО ЦЕНТРУ -->
    <div class="selected-case">
      <div class="case-icon" id="selectedCaseIcon">📦</div>

      <div class="case-name" id="selectedCaseName">
        Обычный кейс
      </div>

      <div class="case-price">
        💰 <span id="selectedCasePrice">2500</span>
      </div>
    </div>

    <!-- КНОПКА КЕЙСОВ СПРАВА -->
    <button class="cases-button" onclick="showCases()">
      📦
      <span>Кейсы</span>
    </button>

  </div>

  <button class="open-button" id="openButton" onclick="openCase()">
    ОТКРЫТЬ КЕЙС
  </button>

  <div class="stats">

    <div class="stat">
      <div class="stat-title">Открыто кейсов</div>
      <div class="stat-value" id="opened">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Энергия</div>
      <div class="stat-value">⚡ <span id="energy">10</span>/10</div>
    </div>

    <div class="stat">
      <div class="stat-title">Всего заработано</div>
      <div class="stat-value">💰 <span id="totalEarned">0</span></div>
    </div>

    <div class="stat">
      <div class="stat-title">Удача</div>
      <div class="stat-value" id="luck">Обычная</div>
    </div>

  </div>

</div>


<!-- ===== ЭКРАН КЕЙСОВ ===== -->

<div class="screen hidden" id="casesScreen">

  <div class="cases-header">

    <button class="back-button" onclick="showHome()">
      ←
    </button>

    <div class="cases-title">
      📦 Кейсы
    </div>

  </div>

  <div class="case-list" id="caseList"></div>

</div>


<!-- ===== МОДАЛКА ===== -->

<div class="modal hidden" id="rewardModal">

  <div class="modal-box">

    <div class="modal-title">
      🎉 Кейс открыт!
    </div>

    <div class="reward-money">
      +💰 <span id="rewardMoney">0</span>
    </div>

    <div class="items" id="items"></div>

    <button class="close-button" onclick="closeReward()">
      ЗАБРАТЬ
    </button>

  </div>

</div>


<script>

/* =========================
   ДАННЫЕ КЕЙСОВ
========================= */

const cases = {

  1: {
    name: "Обычный кейс",
    icon: "📦",
    price: 2500,
    min: 500,
    max: 10000,
    level: 1
  },

  2: {
    name: "Военный кейс",
    icon: "🪖",
    price: 10000,
    min: 2000,
    max: 50000,
    level: 5
  },

  3: {
    name: "Алмазный кейс",
    icon: "💎",
    price: 50000,
    min: 15000,
    max: 200000,
    level: 10
  },

  4: {
    name: "Легендарный кейс",
    icon: "👑",
    price: 250000,
    min: 40000,
    max: 1000000,
    level: 20
  }

};


/* =========================
   ПРЕДМЕТЫ
========================= */

const itemPool = [

  {
    name: "Монета",
    icon: "🪙",
    rarity: "Обычный"
  },

  {
    name: "Кристалл",
    icon: "💠",
    rarity: "Необычный"
  },

  {
    name: "Золотой слиток",
    icon: "🥇",
    rarity: "Редкий"
  },

  {
    name: "Алмаз",
    icon: "💎",
    rarity: "Эпический"
  },

  {
    name: "Корона",
    icon: "👑",
    rarity: "Легендарный"
  },

  {
    name: "Артефакт",
    icon: "🔮",
    rarity: "Мифический"
  }

];


/* =========================
   СОХРАНЕНИЕ
========================= */

let balance =
  Number(localStorage.getItem("balance")) || 10000;

let opened =
  Number(localStorage.getItem("opened")) || 0;

let energy =
  Number(localStorage.getItem("energy"));

if (isNaN(energy)) {
  energy = 10;
}

let totalEarned =
  Number(localStorage.getItem("totalEarned")) || 0;

let luckyActive =
  localStorage.getItem("luckyActive") === "true";

let luckyProgress =
  Number(localStorage.getItem("luckyProgress")) || 0;


/* =========================
   ВЫБРАННЫЙ КЕЙС
========================= */

let selectedCase =
  Number(localStorage.getItem("selectedCase")) || 1;


/* =========================
   УРОВЕНЬ
========================= */

function getLevel() {

  return Math.floor(opened / 10) + 1;

}


/* =========================
   СОХРАНИТЬ
========================= */

function save() {

  localStorage.setItem("balance", balance);
  localStorage.setItem("opened", opened);
  localStorage.setItem("energy", energy);
  localStorage.setItem("totalEarned", totalEarned);
  localStorage.setItem("luckyActive", luckyActive);
  localStorage.setItem("luckyProgress", luckyProgress);
  localStorage.setItem("selectedCase", selectedCase);

}


/* =========================
   ОБНОВИТЬ ЭКРАН
========================= */

function updateUI() {

  const level = getLevel();

  document.getElementById("balance").textContent =
    balance.toLocaleString("ru-RU");

  document.getElementById("opened").textContent =
    opened;

  document.getElementById("energy").textContent =
    energy;

  document.getElementById("level").textContent =
    level;

  document.getElementById("totalEarned").textContent =
    totalEarned.toLocaleString("ru-RU");

  document.getElementById("luck").textContent =
    luckyActive ? "🔥 2× удача" : "Обычная";


  const current = cases[selectedCase];

  document.getElementById("selectedCaseIcon").textContent =
    current.icon;

  document.getElementById("selectedCaseName").textContent =
    current.name;

  document.getElementById("selectedCasePrice").textContent =
    current.price.toLocaleString("ru-RU");


  const button = document.getElementById("openButton");

  if (balance < current.price || energy <= 0) {

    button.disabled = true;

  } else {

    button.disabled = false;

  }

}


/* =========================
   ГЛАВНЫЙ ЭКРАН
========================= */

function showHome() {

  document.getElementById("homeScreen")
    .classList.remove("hidden");

  document.getElementById("casesScreen")
    .classList.add("hidden");

  updateUI();

}


/* =========================
   ЭКРАН КЕЙСОВ
========================= */

function showCases() {

  document.getElementById("homeScreen")
    .classList.add("hidden");

  document.getElementById("casesScreen")
    .classList.remove("hidden");

  renderCases();

}


/* =========================
   СПИСОК КЕЙСОВ
========================= */

function renderCases() {

  const list =
    document.getElementById("caseList");

  const level = getLevel();

  list.innerHTML = "";

  for (const id in cases) {

    const c = cases[id];

    const unlocked =
      level >= c.level;

    const card =
      document.createElement("div");

    card.className =
      "case-card" +
      (unlocked ? "" : " locked");


    let buttonHTML = "";

    if (unlocked) {

      buttonHTML = `
        <button
          class="select-case"
          onclick="selectCase(${id})">
          ВЫБРАТЬ
        </button>
      `;

    } else {

      buttonHTML = `
        <div class="lock-text">
          🔒 ${c.level} уровень
        </div>
      `;

    }


    card.innerHTML = `

      <div class="case-card-icon">
        ${c.icon}
      </div>

      <div class="case-card-info">

        <div class="case-card-name">
          ${c.name}
        </div>

        <div class="case-card-price">
          💰 ${c.price.toLocaleString("ru-RU")}
        </div>

        ${
          !unlocked
          ? `<div class="lock-text">
               🔒 Откроется с ${c.level} уровня
             </div>`
          : ""
        }

      </div>

      ${buttonHTML}

    `;

    list.appendChild(card);

  }

}


/* =========================
   ВЫБРАТЬ КЕЙС
========================= */

function selectCase(id) {

  const c = cases[id];

  if (getLevel() < c.level) {
    return;
  }

  selectedCase = id;

  save();

  showHome();

}


/* =========================
   СЛУЧАЙНОЕ ЧИСЛО
========================= */

function randomInt(min, max) {

  return Math.floor(
    Math.random() * (max - min + 1)
  ) + min;

}


/* =========================
   ОТКРЫТИЕ КЕЙСА
========================= */

function openCase() {

  const c = cases[selectedCase];

  if (balance < c.price) {

    alert("Недостаточно денег!");

    return;

  }

  if (energy <= 0) {

    alert("Закончилась энергия!");

    return;

  }


  /* Снимаем цену */

  balance -= c.price;

  energy--;


  /* Шанс удачи */

  let reward;


  if (luckyActive) {

    reward =
      randomInt(
        Math.ceil((c.min + c.max) / 2),
        c.max
      );

    luckyActive = false;

  } else {

    reward =
      randomInt(c.min, c.max);

  }


  /* Маленький шанс выбить максимум */

  if (Math.random() < 0.01) {

    reward = c.max;

  }


  balance += reward;

  totalEarned += reward;

  opened++;

  luckyProgress++;


  /* Каждые 10 кейсов — удача */

  if (luckyProgress >= 10) {

    luckyActive = true;

    luckyProgress = 0;

  }


  /* Не даём балансу уйти ниже нуля */

  if (balance < 0) {
    balance = 0;
  }


  save();

  updateUI();


  /* Показываем награду */

  showReward(reward);

}


/* =========================
   НАГРАДА
========================= */

function showReward(reward) {

  document.getElementById("rewardMoney")
    .textContent =
    reward.toLocaleString("ru-RU");


  const items =
    document.getElementById("items");

  items.innerHTML = "";


  const count =
    randomInt(2, 5);


  const used = [];


  while (used.length < count) {

    const item =
      itemPool[
        randomInt(0, itemPool.length - 1)
      ];

    if (!used.includes(item)) {
      used.push(item);
    }

  }


  used.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "item";

    div.innerHTML = `

      <div class="item-image">
        ${item.icon}
      </div>

      <div class="item-name">
        ${item.name}
      </div>

      <div class="item-rarity">
        ${item.rarity}
      </div>

    `;

    items.appendChild(div);

  });


  document.getElementById("rewardModal")
    .classList.remove("hidden");

}


/* =========================
   ЗАКРЫТЬ НАГРАДУ
========================= */

function closeReward() {

  document.getElementById("rewardModal")
    .classList.add("hidden");

}


/* =========================
   СТАРТ
========================= */

updateUI();

</script>

</body>
</html>
