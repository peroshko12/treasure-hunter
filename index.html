<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Treasure Hunter</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(160deg, #081a2e, #06101d);
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  max-width: 500px;
  margin: auto;
  padding: 18px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-size: 22px;
  font-weight: 900;
}

.balance {
  background: #142a41;
  padding: 10px 13px;
  border-radius: 14px;
  font-weight: bold;
}

.location {
  text-align: center;
  margin-top: 30px;
  color: #91a6ba;
  font-size: 12px;
}

.place {
  text-align: center;
  font-size: 26px;
  font-weight: 900;
  margin-top: 6px;
}

/* СУНДУК */

.chest-area {
  height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chest {
  width: 190px;
  height: 145px;
  position: relative;
  filter: drop-shadow(0 15px 15px rgba(0,0,0,.5));
}

.chest-body {
  position: absolute;
  bottom: 0;
  width: 190px;
  height: 95px;
  background: linear-gradient(#a85c25, #683512);
  border: 6px solid #32180a;
  border-radius: 8px 8px 15px 15px;
}

.chest-lid {
  position: absolute;
  top: 2px;
  left: 0;
  width: 190px;
  height: 75px;
  background: linear-gradient(#c8792d, #814218);
  border: 6px solid #32180a;
  border-radius: 100px 100px 10px 10px;
  transform-origin: bottom center;
  transition: transform .7s;
  z-index: 3;
}

.chest-lid:after {
  content: "";
  position: absolute;
  left: 20px;
  right: 20px;
  top: 18px;
  height: 8px;
  background: #e1a23d;
  border-radius: 5px;
}

.lock {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 58px;
  transform: translateX(-50%);
  width: 34px;
  height: 42px;
  background: #f1bd43;
  border: 4px solid #65400e;
  border-radius: 6px;
}

.opened .chest-lid {
  transform: rotateX(-120deg);
}

.shake {
  animation: shake .12s infinite;
}

@keyframes shake {
  0% { transform: rotate(0); }
  25% { transform: rotate(-4deg); }
  50% { transform: rotate(4deg); }
  75% { transform: rotate(-3deg); }
  100% { transform: rotate(0); }
}

/* КНОПКА */

.open {
  width: 100%;
  padding: 18px;
  border: 0;
  border-radius: 18px;
  background: linear-gradient(135deg, #ffc94f, #e99a20);
  color: #241600;
  font-size: 19px;
  font-weight: 900;
}

.open:active {
  transform: scale(.97);
}

/* СТАТИСТИКА */

.stats {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.stat {
  flex: 1;
  background: #102238;
  padding: 14px 5px;
  border-radius: 14px;
  text-align: center;
  font-size: 13px;
}

/* ОКНО НАГРАД */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.box {
  width: 100%;
  max-width: 390px;
  background: #10243a;
  border-radius: 22px;
  padding: 22px;
  text-align: center;
}

.box h2 {
  margin-top: 0;
}

.rewards {
  margin-top: 15px;
}

.reward {
  display: flex;
  justify-content: space-between;
  background: #0b1929;
  padding: 12px;
  margin-top: 8px;
  border-radius: 12px;
}

.close {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  background: #29435d;
  color: white;
  font-size: 17px
}

/* Закрытие окна */
.close {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  background: #29435d;
  color: white;
  font-size: 17px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="title">💎 Treasure Hunter</div>
    <div class="balance" id="balance">💰 10 000</div>
  </div>

  <div class="location">ТЕКУЩАЯ ЛОКАЦИЯ</div>
  <div class="place">🏝️ Старый пляж</div>

  <div class="chest-area">

    <div class="chest" id="chest">
      <div class="chest-lid"></div>
      <div class="chest-body"></div>
      <div class="lock"></div>
    </div>

  </div>

  <button class="open" onclick="openChest()">
    🎁 ОТКРЫТЬ ЯЩИК — 2 500 💰
  </button>

  <div class="stats">
    <div class="stat">⚡ 10/10</div>
    <div class="stat">📈 Ур. 1</div>
    <div class="stat" id="opened">🎁 0</div>
  </div>

</div>

<div class="modal" id="modal">

  <div class="box">

    <h2>🎉 Ящик открыт!</h2>

    <div id="moneyResult"></div>

    <div class="rewards" id="rewards"></div>

    <button class="close" onclick="closeModal()">
      Продолжить
    </button>

  </div>

</div>

<script>

let balance = 10000;
let opened = 0;
const price = 2500;

const items = [
  ["🪙", "Старинная монета"],
  ["🗝️", "Старый ключ"],
  ["💎", "Кристалл"],
  ["🏺", "Старая реликвия"],
  ["🧭", "Компас"],
  ["👑", "Золотая реликвия"]
];

function random(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function openChest() {

  if (balance < price) {
    alert("❌ Недостаточно денег!\n\nНужно 2 500 💰");
    return;
  }

  balance -= price;
  updateBalance();

  const chest = document.getElementById("chest");

  chest.classList.remove("opened");
  chest.classList.add("shake");

  setTimeout(function() {

    chest.classList.remove("shake");
    chest.classList.add("opened");

    setTimeout(function() {
      createRewards();
    }, 700);

  }, 900);
}

function createRewards() {

  const roll = Math.random() * 100;
  let money;

  if (roll < 25) {
    money = random(300, 800);
  } else if (roll < 50) {
    money = random(800, 1500);
  } else if (roll < 70) {
    money = random(1500, 2400);
  } else if (roll < 85) {
    money = random(2500, 5000);
  } else if (roll < 97) {
    money = random(5000, 15000);
  } else {
    money = random(15000, 50000);
  }

  balance += money;
  opened++;

  updateBalance();

  const result = document.getElementById("moneyResult");
  const difference = money - price;

  if (difference < 0) {
    result.innerHTML =
      "💰 Получено: <b>" +
      money.toLocaleString("ru-RU") +
      "</b><br>📉 Убыток: <b>" +
      difference.toLocaleString("ru-RU") +
      " 💰</b>";
  } else if (difference === 0) {
    result.innerHTML = "💰 Ящик окупился!";
  } else {
    result.innerHTML =
      "💰 Получено: <b>+" +
      money.toLocaleString("ru-RU") +
      "</b><br>📈 Прибыль: <b>+" +
      difference.toLocaleString("ru-RU") +
      " 💰</b>";
  }

  const rewards = document.getElementById("rewards");
  rewards.innerHTML = "";

  const count = random(2, 5);

  for (let i = 0; i < count; i++) {

    const item = items[random(0, items.length - 1)];
    const quantity = random(1, 4);

    const div = document.createElement("div");

    div.className = "reward";

    div.innerHTML =
      "<span>" + item[0] + " " + item[1] +
      "</span><b>×" + quantity + "</b>";

    rewards.appendChild(div);
  }

  document.getElementById("modal").classList.add("show");
}

function closeModal() {

  document.getElementById("modal").classList.remove("show");
  document.getElementById("chest").classList.remove("opened");

}

function updateBalance() {

  document.getElementById("balance").innerHTML =
    "💰 " + balance.toLocaleString("ru-RU");

  document.getElementById("opened").innerHTML =
    "🎁 " + opened;

}

</script>

</body>
</html>
