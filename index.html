<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunter</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #07152e, #0d2345);
  color: white;
  min-height: 100vh;
  text-align: center;
}

.container {
  max-width: 430px;
  margin: auto;
  padding: 20px 15px;
}

h1 {
  margin: 10px 0 5px;
  font-size: 30px;
}

.subtitle {
  color: #9eb6d8;
  margin-bottom: 20px;
}

.balance {
  background: #102b50;
  border: 1px solid #244a78;
  border-radius: 16px;
  padding: 15px;
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 20px;
}

.location {
  color: #82b7ff;
  margin-bottom: 25px;
}

/* СУНДУК */

.chest-area {
  height: 240px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.chest {
  width: 190px;
  height: 145px;
  position: relative;
  filter: drop-shadow(0 15px 15px rgba(0,0,0,.4));
}

.chest-body {
  position: absolute;
  width: 190px;
  height: 95px;
  bottom: 0;
  left: 0;
  background: linear-gradient(#a85d27, #713716);
  border: 5px solid #49230f;
  border-radius: 8px 8px 15px 15px;
}

.chest-lid {
  position: absolute;
  width: 190px;
  height: 72px;
  top: 0;
  left: 0;
  background: linear-gradient(#c87532, #8b451c);
  border: 5px solid #49230f;
  border-radius: 18px 18px 6px 6px;

  /* 2D-анимация */
  transform-origin: left bottom;
  transition: transform .55s cubic-bezier(.2,.8,.2,1);
  z-index: 3;
}

/* ОТКРЫТИЕ ТОЛЬКО В 2D */
.opened .chest-lid {
  transform: translateY(-55px) rotate(-12deg);
}

.lock {
  position: absolute;
  width: 32px;
  height: 42px;
  background: #e5b82e;
  border: 4px solid #8a6410;
  border-radius: 6px;
  left: 79px;
  top: 55px;
  z-index: 5;
  transition: opacity .2s, transform .2s;
}

.opened .lock {
  opacity: 0;
  transform: scale(.7);
}

/* АНИМАЦИЯ ТРЯСКИ */

.shake {
  animation: shake .45s;
}

@keyframes shake {
  0% { transform: translateX(0); }
  20% { transform: translateX(-8px) rotate(-2deg); }
  40% { transform: translateX(8px) rotate(2deg); }
  60% { transform: translateX(-6px) rotate(-1deg); }
  80% { transform: translateX(6px) rotate(1deg); }
  100% { transform: translateX(0); }
}

/* КНОПКА */

.open-button {
  width: 100%;
  border: none;
  border-radius: 15px;
  padding: 17px;
  background: linear-gradient(135deg, #ffb52e, #ff7b18);
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(255,130,20,.25);
}

.open-button:active {
  transform: scale(.97);
}

.open-button:disabled {
  opacity: .5;
}

/* СТАТИСТИКА */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 20px;
}

.stat {
  background: #102b50;
  border: 1px solid #244a78;
  border-radius: 12px;
  padding: 12px 5px;
}

.stat-number {
  font-size: 19px;
  font-weight: bold;
}

.stat-name {
  color: #8fa9ca;
  font-size: 12px;
  margin-top: 4px;
}

/* МОДАЛЬНОЕ ОКНО */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;

  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}

.modal.show {
  opacity: 1;
  pointer-events: auto;
}

.modal-box {
  width: 100%;
  max-width: 390px;
  background: #102b50;
  border: 1px solid #315b8c;
  border-radius: 20px;
  padding: 25px 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.modal-title {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 15px;
}

.money-reward {
  font-size: 27px;
  color: #ffd34d;
  font-weight: bold;
  margin-bottom: 20px;
}

.items {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.item {
  background: #173963;
  border-radius: 10px;
  padding: 11px;
  text-align: left;
}

.close-button {
  margin-top: 20px;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #315b8c;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

/* ТЕКСТ */

.small {
  color: #8fa9ca;
  font-size: 13px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

  <h1>💎 Treasure Hunter</h1>

  <div class="subtitle">
    Охота за сокровищами
  </div>

  <div class="balance">
    💰 <span id="balance">10 000</span>
  </div>

  <div class="location">
    📍 Старая бухта
  </div>

  <div class="chest-area">

    <div class="chest" id="chest">

      <div class="chest-lid"></div>

      <div class="chest-body"></div>

      <div class="lock"></div>

    </div>

  </div>

  <button class="open-button" id="openButton" onclick="openChest()">
    🎁 ОТКРЫТЬ ЯЩИК — 2 500 💰
  </button>

  <div class="stats">

    <div class="stat">
      <div class="stat-number">⚡ <span id="energy">10</span>/10</div>
      <div class="stat-name">Энергия</div>
    </div>

    <div class="stat">
      <div class="stat-number">⭐ 1</div>
      <div class="stat-name">Уровень</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="opened">0</div>
      <div class="stat-name">Открыто</div>
    </div>

  </div>

  <div class="small">
    Каждый ящик может принести как прибыль, так и убыток.
  </div>

</div>


<!-- ОКНО НАГРАД -->

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-title">
      🎉 Ящик открыт!
    </div>

    <div class="money-reward" id="moneyReward">
      +0 💰
    </div>

    <div class="items" id="items"></div>

    <button class="close-button" onclick="closeModal()">
      Забрать награды
    </button>

  </div>

</div>


<script>

let balance = 10000;
let opened = 0;

const price = 2500;

const itemsList = [
  "🪙 Старинная монета",
  "🗝️ Старый ключ",
  "💎 Кристалл",
  "🏺 Старая реликвия",
  "🧭 Компас",
  "👑 Золотая реликвия"
];

function formatNumber(number) {
  return number.toLocaleString("ru-RU");
}

function updateBalance() {
  document.getElementById("balance").textContent =
    formatNumber(balance);
}

function openChest() {

  if (balance < price) {
    alert("Недостаточно денег!");
    return;
  }

  const chest = document.getElementById("chest");
  const button = document.getElementById("openButton");

  button.disabled = true;

  // Списываем стоимость
  balance -= price;
  updateBalance();

  // Сбрасываем старую анимацию
  chest.classList.remove("opened");
  chest.classList.remove("shake");

  // Перезапуск анимации
  void chest.offsetWidth;

  chest.classList.add("shake");

  setTimeout(function() {

    chest.classList.add("opened");

    createRewards();

  }, 500);
}


function createRewards() {

  let reward;

  const random = Math.random();

  if (random < 0.25) {

    reward = randomNumber(300, 800);

  } else if (random < 0.50) {

    reward = randomNumber(800, 1500);

  } else if (random < 0.70) {

    reward = randomNumber(1500, 2400);

  } else if (random < 0.85) {

    reward = randomNumber(2500, 5000);

  } else if (random < 0.97) {

    reward = randomNumber(5000, 15000);

  } else {

    reward = randomNumber(15000, 50000);

  }


  // Деньги добавляются только после открытия
  balance += reward;

  opened++;

  updateBalance();

  document.getElementById("opened").textContent = opened;

  document.getElementById("moneyReward").textContent =
    "+" + formatNumber(reward) + " 💰";


  // От 2 до 5 предметов
  const amount = randomNumber(2, 5);

  const shuffled = [...itemsList].sort(() => Math.random() - 0.5);

  const selectedItems = shuffled.slice(0, amount);

  const itemsContainer = document.getElementById("items");

  itemsContainer.innerHTML = "";

  selectedItems.forEach(function(item) {

    const div = document.createElement("div");

    div.className = "item";

    div.textContent = "✨ " + item;

    itemsContainer.appendChild(div);

  });


  setTimeout(function() {

    document.getElementById("modal").classList.add("show");

  }, 500);

}


function randomNumber(min, max) {

  return Math.floor(
    Math.random() * (max - min + 1)
  ) + min;

}


function closeModal() {

  document.getElementById("modal").classList.remove("show");

  const chest = document.getElementById("chest");

  setTimeout(function() {

    chest.classList.remove("opened");
    chest.classList.remove("shake");

    document.getElementById("openButton").disabled = false;

  }, 250);

}

</script>

</body>
</html>
